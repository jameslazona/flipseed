<title>FLIPSEED</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style id="fs-style">
/* Layout: a sunny clay garden. One centred column of chunky, pressable 3D tiles; studio = work bench, student side = big floating game tiles. */
:root{
  --bg:#e4f4ea; --bg1:#d6edff; --bg2:#e8f7e3; --blob1:rgba(255,205,70,.38); --blob2:rgba(72,200,125,.26); --blob3:rgba(110,170,255,.30);
  --surface:#ffffff; --surface-2:#f1f8f2; --ink:#14301e; --muted:#557064; --line:#d2e3d6;
  --depth:#c3d8c9; --drop:rgba(20,60,35,.35); --hi:rgba(255,255,255,.95); --sheen:rgba(255,255,255,.65);
  --leaf:#23864f; --leaf-hi:#55d48c; --leaf-depth:#146238; --leaf-soft:#d5f2df; --on-leaf:#ffffff;
  --sun:#ffc12e; --sun-hi:#ffe27d; --sun-depth:#c98a00; --sun-soft:#fff0c0; --on-sun:#3a2900;
  --sky:#2f7fd6; --sky-hi:#7fc0ff; --sky-depth:#1b5aa0; --sky-soft:#dcecfd;
  --coral:#d9513a; --coral-soft:#fde0d8; --plum:#7a55c9;
  --t1:#cfe6ff; --t2:#ffeeb5; --t3:#cff2dc; --t4:#ffd9cc; --t5:#e7dcff; --t6:#c9f1f1;
  --logo-1:#0f5a3a; --logo-2:#5cb83a; --plate:#ffffff;
  --sky-top:#9fd8ff; --sky-mid:#cdeeff; --sky-bot:#eefaf0; --sunc:#ffe066; --sun-glow:rgba(255,214,80,.55); --cloud:rgba(255,255,255,.92); --hill1:#c9efb4; --hill2:#a3e08c; --hill3:#7cc96f; --hill-dot:#ffd23f; --doodle-op:.5; --star-op:0; --bubble:rgba(255,255,255,.75);
  --f-display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1711; --bg1:#0c1b2a; --bg2:#0c1a12; --blob1:rgba(255,190,40,.10); --blob2:rgba(60,190,110,.14); --blob3:rgba(80,140,255,.14);
  --surface:#1a2e23; --surface-2:#142519; --ink:#e4f2e8; --muted:#a2bcab; --line:#2b4537;
  --depth:#07120c; --drop:rgba(0,0,0,.7); --hi:rgba(255,255,255,.08); --sheen:rgba(255,255,255,.07);
  --leaf:#46b876; --leaf-hi:#5fd48f; --leaf-depth:#0d4426; --leaf-soft:#1c3d2a; --on-leaf:#ffffff;
  --sun:#ffcd4f; --sun-hi:#ffdf80; --sun-depth:#8f6300; --sun-soft:#3b3214; --on-sun:#2d2000;
  --sky:#5ea6f0; --sky-hi:#86c0ff; --sky-depth:#174a80; --sky-soft:#17314d;
  --coral:#f07c64; --coral-soft:#46231c; --plum:#ae92f3;
  --t1:#1d3652; --t2:#3e3518; --t3:#1d4029; --t4:#472a21; --t5:#30284d; --t6:#173f3f; --logo-1:#7fdca0; --logo-2:#b6e86a; --plate:#f7fbf4; --sky-top:#071226; --sky-mid:#0c1d33; --sky-bot:#0e2219; --sunc:#f4f1d9; --sun-glow:rgba(240,235,200,.18); --cloud:rgba(255,255,255,.05); --hill1:#173d29; --hill2:#123222; --hill3:#0d281a; --hill-dot:#e9d27a; --doodle-op:.28; --star-op:1; --bubble:rgba(150,220,255,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1711; --bg1:#0c1b2a; --bg2:#0c1a12; --blob1:rgba(255,190,40,.10); --blob2:rgba(60,190,110,.14); --blob3:rgba(80,140,255,.14);
  --surface:#1a2e23; --surface-2:#142519; --ink:#e4f2e8; --muted:#a2bcab; --line:#2b4537;
  --depth:#07120c; --drop:rgba(0,0,0,.7); --hi:rgba(255,255,255,.08); --sheen:rgba(255,255,255,.07);
  --leaf:#46b876; --leaf-hi:#5fd48f; --leaf-depth:#0d4426; --leaf-soft:#1c3d2a; --on-leaf:#ffffff;
  --sun:#ffcd4f; --sun-hi:#ffdf80; --sun-depth:#8f6300; --sun-soft:#3b3214; --on-sun:#2d2000;
  --sky:#5ea6f0; --sky-hi:#86c0ff; --sky-depth:#174a80; --sky-soft:#17314d;
  --coral:#f07c64; --coral-soft:#46231c; --plum:#ae92f3;
  --t1:#1d3652; --t2:#3e3518; --t3:#1d4029; --t4:#472a21; --t5:#30284d; --t6:#173f3f; --logo-1:#7fdca0; --logo-2:#b6e86a; --plate:#f7fbf4; --sky-top:#071226; --sky-mid:#0c1d33; --sky-bot:#0e2219; --sunc:#f4f1d9; --sun-glow:rgba(240,235,200,.18); --cloud:rgba(255,255,255,.05); --hill1:#173d29; --hill2:#123222; --hill3:#0d281a; --hill-dot:#e9d27a; --doodle-op:.28; --star-op:1; --bubble:rgba(150,220,255,.25); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  background-color:var(--sky-bot);
  background-image:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 45%,var(--sky-bot) 80%);
  background-attachment:fixed}
#app{position:relative;z-index:1}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx .dots{position:absolute;inset:0;background-image:radial-gradient(var(--sheen) 1.5px,transparent 1.6px);background-size:28px 28px;opacity:.5;mask-image:linear-gradient(180deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%)}
.bgfx .sun{position:absolute;right:6%;top:5%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7c2,var(--sunc) 55%);box-shadow:0 0 0 18px var(--sun-glow),0 0 80px 40px var(--sun-glow);animation:glow 6s ease-in-out infinite}
.bgfx .rays{position:absolute;right:calc(6% - 90px);top:calc(5% - 90px);width:300px;height:300px;border-radius:50%;background:repeating-conic-gradient(var(--sun-glow) 0 8deg,transparent 8deg 22deg);mask-image:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 60s linear infinite;opacity:.7}
.bgfx .cloud{position:absolute;width:220px;height:70px;border-radius:999px;background:var(--cloud);filter:drop-shadow(0 8px 10px rgba(40,90,140,.12));animation:drift linear infinite}
.bgfx .cloud::before,.bgfx .cloud::after{content:"";position:absolute;background:var(--cloud);border-radius:50%}
.bgfx .cloud::before{width:100px;height:100px;left:34px;top:-48px}
.bgfx .cloud::after{width:74px;height:74px;left:112px;top:-30px}
.bgfx .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:min(30vh,260px)}
.bgfx .doodle{position:absolute;opacity:var(--doodle-op);filter:drop-shadow(0 10px 8px rgba(0,0,0,.18));animation:floaty ease-in-out infinite alternate}
.bgfx .bubble{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),var(--bubble) 40%,transparent 70%);box-shadow:inset 0 0 0 2px var(--bubble);animation:rise linear infinite}
.bgfx .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:var(--star-op);box-shadow:0 0 6px 1px rgba(255,255,255,.8);animation:twinkle 3s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(calc(100vw + 260px))}}
@keyframes floaty{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-26px) rotate(8deg)}}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}50%{transform:translateY(-55vh) translateX(18px)}100%{transform:translateY(-110vh) translateX(-10px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{transform:scale(1.06)}}
@keyframes twinkle{50%{transform:scale(.4);filter:brightness(.6)}}
@media (max-width:640px){.bgfx .sun{width:80px;height:80px;right:4%;top:3%}.bgfx .rays{display:none}.bgfx .doodle{opacity:calc(var(--doodle-op)*.6)}.bgfx .cloud{transform-origin:left;scale:.7}}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.4vw,2.9rem);font-weight:800}
h2{font-size:clamp(1.45rem,3.8vw,1.9rem);font-weight:800}
h3{font-size:1.22rem;font-weight:800}
p{margin:0}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
.t3d{color:var(--ink);text-shadow:0 2px 0 var(--sheen),0 4px 0 var(--depth),0 10px 16px var(--drop)}

/* 3D surfaces */
.clay,.panel,.lesson,.game,.act-row,.wcard,.qcard,.tile,.opt,.fc-face,.cert,.letter,.bin,.langs,.ws-board,.stat{
  background:linear-gradient(180deg,var(--surface),var(--surface-2));border:0;border-radius:var(--r);
  box-shadow:inset 0 2px 0 var(--hi),0 6px 0 var(--depth),0 20px 30px -18px var(--drop)}
.ico{display:inline-block;width:1.6em;height:1.6em;object-fit:contain;flex:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2));vertical-align:middle}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 20px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.05em;color:var(--leaf);background:none;border:0;padding:0;cursor:pointer;text-shadow:0 2px 0 var(--sheen),0 3px 0 var(--leaf-depth),0 8px 12px var(--drop)}
.brand .w1{color:var(--logo-1)}.brand .w2{color:var(--logo-2)}
.brand{color:var(--logo-1);text-shadow:0 2px 0 var(--sheen),0 3px 0 var(--depth),0 8px 12px var(--drop);gap:10px}
.plate{display:inline-grid;place-items:center;background:var(--plate);border-radius:16px;padding:3px 6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 5px 0 var(--depth),0 12px 18px -10px var(--drop);transition:transform .25s}
.brand .plate img{width:58px;height:auto;display:block}
.brand:hover .plate{transform:rotate(-6deg) scale(1.06)}
.hero-logo{flex:0 0 250px;max-width:100%;padding:12px;background:var(--plate);border-radius:30px;transform:rotate(-2deg);box-shadow:inset 0 3px 0 rgba(255,255,255,.9),0 8px 0 var(--depth),0 26px 34px -18px var(--drop);animation:bob 4.5s ease-in-out infinite;position:relative;z-index:1}
.hero-logo img{display:block;width:100%;height:auto;border-radius:18px}
@media (max-width:560px){.hero-logo{flex-basis:auto;width:min(230px,70%);margin:0 auto}}
[hidden]{display:none!important}
.linkstrip{margin-top:4px}
.srcs{display:flex;flex-wrap:wrap;gap:10px;flex:1;min-width:0}
.srcs:empty{display:none}
.src{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:104px;padding:6px;border-radius:16px;background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--depth)}
.src-img{width:90px;height:90px;object-fit:cover;border-radius:12px;background:var(--surface-2)}
.src-ico{width:90px;height:90px;display:grid;place-items:center;border-radius:12px;background:var(--sky-soft)}
.src-ico .ico{width:48px;height:48px}
.src-name{width:100%;font-size:.75rem;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-x{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;font-weight:800;color:#fff;background:var(--coral);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.cp-title{max-width:760px;margin:0 auto 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cp-chap{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--sun);color:var(--on-sun);font-family:var(--f-display);font-weight:800;letter-spacing:.04em;border:3px solid #14301e;box-shadow:3px 3px 0 #14301e;transform:rotate(-2deg)}
.cp-title-text{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.1;color:var(--leaf);text-shadow:0 2px 0 var(--sheen),0 3px 0 var(--leaf-depth)}
.comic{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}
.cpanel{--line-ink:#14301e;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;min-height:250px;border:4px solid var(--line-ink);border-radius:14px;overflow:hidden;
  background:radial-gradient(circle,rgba(0,0,0,.07) 1.4px,transparent 1.6px) 0 0/12px 12px,linear-gradient(180deg,#fff,var(--tint));box-shadow:5px 6px 0 var(--line-ink);
  transform:rotate(var(--tilt)) scale(.6);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .25s}
.cpanel.in{transform:rotate(var(--tilt)) scale(1);opacity:1}
.cp-num{position:absolute;left:0;top:0;padding:1px 10px;background:#14301e;color:#fff;font-family:var(--f-display);font-weight:800;border-bottom-right-radius:10px}
.cp-bubble{position:relative;margin:14px 0 16px;padding:12px 16px;border:3px solid #14301e;border-radius:22px;background:#fff;color:#14301e;text-align:left;cursor:pointer;font:inherit;box-shadow:2px 3px 0 rgba(0,0,0,.15)}
.cp-bubble::before,.cp-bubble::after{content:"";position:absolute;width:0;height:0;border-style:solid;border-color:transparent}
.cp-bubble::before{bottom:-19px;border-width:18px 10px 0 10px;border-top-color:#14301e}
.cp-bubble::after{bottom:-13px;border-width:13px 7px 0 7px;border-top-color:#fff}
.cp-bubble.kid::before{left:30px}.cp-bubble.kid::after{left:33px}
.cp-bubble.seed::before{right:30px}.cp-bubble.seed::after{right:33px}
.cp-say{font-family:var(--f-display);font-weight:700;font-size:clamp(1.12rem,3.6vw,1.3rem);line-height:1.25}
.cp-say .vi-line{color:#7a55c9}
.cp-stage{flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:110px}
.cpanel.kid .cp-stage{flex-direction:row-reverse}
.cp-scene{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;align-self:center}
.cp-emo{font-size:clamp(2.6rem,9vw,3.4rem);line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));animation:cpbob 2.4s ease-in-out infinite}
@keyframes cpbob{50%{transform:translateY(-8px) rotate(4deg)}}
.cp-who{display:flex;flex-direction:column;align-items:center;flex:none}
.cp-face{width:96px;height:96px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));animation:cptalk 1.1s ease-in-out 2}
@keyframes cptalk{25%{transform:translateY(-6px) rotate(-4deg)}75%{transform:translateY(-3px) rotate(3deg)}}
.cp-name{margin:-6px 0 8px;padding:0 10px;border-radius:999px;background:#14301e;color:#fff;font-family:var(--f-display);font-weight:800;font-size:.85rem;position:relative}
.cp-more{display:flex;margin:20px auto 4px;font-size:1.15rem;animation:cpnudge 1.6s ease-in-out infinite}
@keyframes cpnudge{50%{transform:translateX(6px)}}
.cp-recap{max-width:620px;margin:24px auto 14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:inset 0 0 0 3px var(--sun),0 6px 0 var(--sun-depth),0 20px 30px -18px var(--drop)}
.cp-recap-head{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--sun-depth)}
.cp-recap-img{max-width:min(240px,80%);border-radius:14px}
.ce-box{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:18px;background:var(--surface-2);box-shadow:inset 0 3px 8px -5px var(--drop)}
.ce-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--surface)}
.ce-face{width:52px;height:52px}
.ce-fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.ce-fields .inp.ce-who{width:auto;flex:0 1 auto;min-height:40px;padding:4px 10px}
.ce-fields .inp.ce-scene{width:120px;flex:0 1 120px;min-height:40px}
@media (max-width:560px){.ce-row{grid-template-columns:40px 1fr}.ce-row .wtools{grid-column:1/-1;justify-content:flex-end}.ce-face{width:40px;height:40px}}
.vi-line{display:block;font-size:.86em;font-weight:700;color:var(--plum);margin-top:4px;font-family:var(--f-body)}
.lcard{max-width:620px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.lc-pic{width:min(170px,48%)}
.lc-title{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,5vw,2rem);color:var(--leaf);line-height:1.15}
.lc-title.small-title{font-size:1.15rem}
.lc-text{font-size:1.2rem;font-weight:700;max-width:38ch}
.lc-ex{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;border-radius:16px;background:var(--sun-soft);font-weight:700;max-width:38ch}
.lc-ex-tag{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sun-depth)}
.dots-row{display:flex;gap:8px;justify-content:center}
.dotp{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dotp.done{background:var(--leaf-hi)}.dotp.on{background:var(--leaf);transform:scale(1.3)}
.cq-card{max-width:680px;margin:0 auto;width:100%}
.cq-img{max-width:min(320px,100%);border-radius:16px;box-shadow:0 4px 0 var(--depth)}
.cq-opts{display:flex;flex-direction:column;gap:10px;max-width:680px;margin:0 auto;width:100%}
.cq-opt{display:flex;align-items:center;gap:12px;text-align:left;font-family:var(--f-body);font-size:1.12rem;min-height:60px;padding:10px 14px}
.cq-opt[disabled]{cursor:default}
.cq-letter{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-family:var(--f-display);font-weight:800;background:var(--sky-soft);color:var(--sky-depth)}
.cq-otext{flex:1;min-width:0}
.cq-fb{max-width:680px;margin:0 auto;width:100%;border-radius:20px;padding:0}
.cq-fb.good,.cq-fb.bad{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.cq-fb.good{background:var(--leaf-soft)}
.cq-fb.bad{background:var(--sun-soft)}
.cq-fb-head{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.cq-ans{font-weight:800}
.cq-explain{font-size:1.05rem;font-weight:600}
.cq-hint{max-width:680px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:4px}
.kind-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.kind-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-radius:22px;cursor:pointer;text-align:left;color:var(--ink);background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 2px 0 var(--hi),0 6px 0 var(--depth)}
.kind-card strong{font-family:var(--f-display);font-size:1.25rem}
.kind-card.on{box-shadow:inset 0 0 0 3px var(--leaf),0 6px 0 var(--leaf-depth);background:linear-gradient(180deg,var(--leaf-soft),var(--surface))}
.kind-card .pod{flex:none;margin:0}
.kind-chip.q{background:var(--t5);color:var(--plum)}
.qe-card{padding:16px;display:flex;flex-direction:column;gap:10px}
.qe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.qe-grid > .field:first-child:has(#ce-x){max-width:120px}
.qe-opt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px;border-radius:16px}
.qe-opt.right{background:var(--leaf-soft)}
.qe-opt .inp{flex:1 1 200px;min-width:0}
.qe-radio{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;cursor:pointer;padding:4px 8px}
.qe-radio input{width:22px;height:22px;accent-color:var(--leaf)}
.qe-thumb{width:56px;height:56px;object-fit:cover;border-radius:12px;box-shadow:0 3px 0 var(--depth)}
.cls-badge.sm{min-width:40px;height:40px;font-size:1rem;border-radius:12px}
.rgroups{display:flex;flex-direction:column;gap:22px}
.cls-box{border-radius:28px;padding:10px 12px 16px;background:linear-gradient(180deg,var(--sky-soft),transparent 120%);box-shadow:inset 0 0 0 2px var(--sheen),0 6px 0 var(--depth),0 20px 30px -18px var(--drop)}
.cls-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;border:0;background:none;padding:6px 6px 12px;cursor:pointer;text-align:left;color:var(--ink)}
.cls-badge{display:grid;place-items:center;min-width:52px;height:52px;padding:0 10px;border-radius:16px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--on-leaf);background:linear-gradient(180deg,var(--leaf-hi),var(--leaf));box-shadow:0 4px 0 var(--leaf-depth)}
.cls-title{font-family:var(--f-display);font-weight:800;font-size:1.5rem;flex:1;min-width:0}
.cls-caret{font-size:1.3rem;color:var(--muted)}
.cls-body{display:flex;flex-direction:column;gap:16px}
.act-box{padding:14px 14px 8px}
.act-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:2px 4px 8px}
.act-head h3{margin-top:2px}
.act-chips{display:flex;gap:6px;flex-wrap:wrap}
.act-box .rtable{min-width:600px}
.rfilters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tablewrap{overflow-x:auto;padding:6px;border-radius:var(--r)}
.rtable{width:100%;border-collapse:collapse;min-width:760px;font-size:.95rem}
.rtable th{text-align:left;padding:10px 10px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--line);white-space:nowrap}
.rtable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtable .ico{width:26px;height:26px}
.sortbtn{border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;padding:0}
.sortbtn.on{color:var(--leaf)}
.rrow{cursor:pointer}
.rrow:hover td,.rrow.open td{background:var(--surface-2)}
.rdetail td{background:var(--surface-2);padding:6px 14px 14px}
.tl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.pbar{height:10px;width:110px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 2px 4px -2px var(--drop);overflow:hidden;margin-bottom:3px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,var(--leaf-hi),var(--leaf))}
.who{max-width:520px;margin:10px auto 0;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.who-art{position:relative;height:96px;display:grid;place-items:center}
.who-art .w1{width:88px;height:88px;animation:bob 3.4s ease-in-out infinite}
.who-art .w2{position:absolute;width:40px;height:40px;left:calc(50% + 40px);top:0;animation:bob 3s ease-in-out infinite -1s}
.who-art .w3{position:absolute;width:44px;height:44px;right:calc(50% + 44px);bottom:0;animation:bob 3.8s ease-in-out infinite -2s}
.whopill{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 0;padding:6px 8px 6px 12px;border-radius:999px;background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--depth);font-weight:700}
.whopill .ico{width:28px;height:28px}
.whopill .btn{margin-bottom:0}
.buildtag{margin-top:28px;text-align:center;font-size:.75rem;color:var(--muted);opacity:.8}
.sfx-row{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
@media (max-width:640px){.sfx-row{grid-template-columns:1fr}}
.sfx-label{font-family:var(--f-display);font-size:1.05rem}
.sfx-opts{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.sfx-opt{display:inline-flex;align-items:stretch;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--depth)}
.sfx-opt.on{box-shadow:inset 0 0 0 3px var(--leaf),0 4px 0 var(--leaf-depth);background:linear-gradient(180deg,var(--leaf-soft),var(--surface))}
.sfx-play{border:0;background:linear-gradient(180deg,var(--sky-hi),var(--sky));color:#fff;font-size:.85rem;padding:0 12px;cursor:pointer;min-height:40px}
.sfx-pick{border:0;background:transparent;padding:6px 12px;font-weight:800;cursor:pointer;color:var(--ink);min-height:40px}
.hintbtn{margin-bottom:6px}
.gone-opt{opacity:.25!important;filter:grayscale(1);pointer-events:none;transform:scale(.96)}
.glowhint{animation:glowhint 1.3s ease-in-out 2}
@keyframes glowhint{0%,100%{box-shadow:inset 0 0 0 3px var(--sun),0 6px 0 var(--sun-depth)}50%{box-shadow:inset 0 0 0 5px var(--sun),0 0 0 8px var(--sun-soft),0 6px 0 var(--sun-depth);transform:translateY(-3px)}}
.zone{display:flex;align-items:center;gap:16px;width:100%;margin-top:22px;padding:16px 18px;border:0;border-radius:var(--r);cursor:pointer;text-align:left;color:var(--ink);
  background:radial-gradient(400px 160px at 0% 0%,var(--sun-soft),transparent 70%),linear-gradient(135deg,var(--surface),var(--t5));box-shadow:inset 0 0 0 3px var(--sun),0 6px 0 var(--sun-depth),0 20px 30px -18px var(--drop);transition:transform .15s}
.zone:hover{transform:translateY(-4px)}
.zone strong{font-family:var(--f-display);font-size:1.45rem;line-height:1.1}
.zone .pod{flex:none}
.zone-best{display:flex;align-items:center;gap:6px;flex:none;font-family:var(--f-display)}
.zone-best b{display:block;font-size:1.6rem;line-height:1}
.zone-best small{display:block;font-size:.75rem;color:var(--muted)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-radius:18px;font-family:var(--f-display);font-size:1.3rem}
.hud .ico{width:30px;height:30px}
.meter.timer i{transition:width 1s linear}
.meter.timer i.low{background:linear-gradient(180deg,#ff9b85,var(--coral))}
.big-inp{font-family:var(--f-display);font-size:1.6rem;font-weight:800;min-height:58px;text-align:center;letter-spacing:.04em}
.big-inp.right{border-color:var(--leaf);background:var(--leaf-soft)}
.big-inp.wrong{border-color:var(--coral);background:var(--coral-soft);animation:shake .35s}
.bigscore{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--leaf);text-shadow:0 3px 0 var(--leaf-depth),0 10px 14px var(--drop)}
.bigscore small{font-size:1.2rem;color:var(--muted);text-shadow:none}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--surface-2);box-shadow:inset 0 3px 8px -5px var(--drop)}
.stepn{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--on-leaf);background:linear-gradient(180deg,var(--leaf-hi),var(--leaf));box-shadow:0 3px 0 var(--leaf-depth)}
.linkstrip .inp{min-height:40px;font-size:.9rem;font-weight:700;color:var(--sky)}
.cert .cert-logo{width:170px;height:auto;border-radius:16px;background:var(--plate);padding:6px;box-shadow:0 5px 0 var(--depth)}
.top .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* clay buttons */
.btn{--b1:var(--surface);--b2:var(--surface-2);--bd:var(--depth);--bt:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 20px;margin-bottom:6px;border:0;border-radius:18px;
  background:linear-gradient(180deg,var(--b1),var(--b2));color:var(--bt);font-weight:800;cursor:pointer;text-decoration:none;
  box-shadow:inset 0 2px 0 var(--hi),0 6px 0 var(--bd),0 14px 18px -10px var(--drop);transition:transform .1s,box-shadow .1s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(5px);box-shadow:inset 0 2px 0 var(--hi),0 1px 0 var(--bd),0 4px 8px -6px var(--drop)}
.btn.primary{--b1:var(--leaf-hi);--b2:var(--leaf);--bd:var(--leaf-depth);--bt:var(--on-leaf);--hi:rgba(255,255,255,.4)}
.btn.sun{--b1:var(--sun-hi);--b2:var(--sun);--bd:var(--sun-depth);--bt:var(--on-sun);--hi:rgba(255,255,255,.5)}
.btn.sky{--b1:var(--sky-hi);--b2:var(--sky);--bd:var(--sky-depth);--bt:#fff;--hi:rgba(255,255,255,.4)}
.btn.ghost{background:transparent;box-shadow:none;margin-bottom:0}
.btn.ghost:active{transform:none}
.btn.danger{--bt:var(--coral)}
.btn.sm{min-height:40px;padding:4px 14px;font-size:.92rem;border-radius:14px}
.btn .ico{width:26px;height:26px}
.btn.sm .ico{width:22px;height:22px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;filter:grayscale(.4)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:800;background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--depth)}
.chip.live{background:var(--leaf-soft);color:var(--leaf)}
.chip.draft{background:var(--sun-soft)}
.panel{padding:20px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:800;font-size:.85rem;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:9px 14px;border-radius:14px;border:2px solid transparent;background:var(--surface-2);box-shadow:inset 0 3px 6px -2px var(--drop),inset 0 -1px 0 var(--hi)}
textarea.inp{min-height:110px;resize:vertical}
.inp:focus{border-color:var(--sky);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.note{padding:12px 16px;border-radius:16px;background:var(--sky-soft);font-size:.94rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.05)}
.note.warn{background:var(--sun-soft)}
.note.bad{background:var(--coral-soft)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:18px;font-weight:800;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35),0 18px 30px -12px var(--drop)}

/* pictures */
.pic{position:relative;display:grid;place-items:center;aspect-ratio:1;width:100%;max-width:100%;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 80% at 30% 15%,var(--sheen),transparent 55%),var(--tint,var(--t1));
  box-shadow:inset 0 3px 0 var(--sheen),inset 0 -8px 0 rgba(0,0,0,.06)}
.pic img{width:100%;height:100%;object-fit:contain;padding:7%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
.pic .emo{font-size:clamp(2.6rem,10vw,5rem);line-height:1;filter:drop-shadow(0 10px 6px rgba(0,0,0,.28))}
.pic.sm .emo{font-size:2.2rem}
.pic.xs .emo{font-size:1.6rem}

/* growth */
.growth{position:relative;width:120px;height:120px;flex:none;display:grid;place-items:end center}
.growth::after{content:"";position:absolute;left:12%;right:12%;bottom:4%;height:22%;border-radius:50%;background:radial-gradient(closest-side,#a8774a,#7b5230);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 6px 10px -4px var(--drop)}
.growth img{position:relative;z-index:1;width:74%;height:74%;object-fit:contain;margin-bottom:10%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28));animation:bob 3.4s ease-in-out infinite}
.growth.sm{width:58px;height:58px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* hero */
.hero3d{position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:26px 24px;overflow:hidden;
  background:radial-gradient(400px 220px at 85% 0%,var(--sun-soft),transparent 70%),linear-gradient(160deg,var(--surface),var(--sky-soft))}
.hero3d .hero-txt{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hero-art{position:relative;flex:0 0 230px;height:170px}
.hero-art img{height:auto!important;position:absolute;filter:drop-shadow(0 12px 8px rgba(0,0,0,.25));animation:bob 4s ease-in-out infinite}
.hero-art .f1{width:120px;left:60px;top:20px}
.hero-art .f2{width:70px;left:0;top:80px;animation-delay:-1s}
.hero-art .f3{width:74px;right:0;top:70px;animation-delay:-2s}
.hero-art .f4{width:44px;left:28px;top:8px;animation-delay:-.5s}
.hero-art .f5{width:50px;right:24px;top:0;animation-delay:-2.6s}
@media (max-width:560px){.hero-art{flex-basis:100%;height:130px}.hero-art .f1{width:96px;left:calc(50% - 48px)}.hero-art .f2{left:12%}.hero-art .f3{right:12%}}

/* studio */
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:18px}
.stat .ico{width:38px;height:38px}
.stat b{font-family:var(--f-display);font-size:1.5rem;line-height:1}
.acts{display:flex;flex-direction:column;gap:14px}
.act-row{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:14px;transition:transform .15s}
.act-row:hover{transform:translateY(-2px)}
.act-row .meta{min-width:0}
.act-row .meta h3{overflow-wrap:anywhere}
.act-row .acts-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.act-row{grid-template-columns:60px 1fr}.act-row .acts-btns{grid-column:1/-1;justify-content:flex-start}}
.drop{border:3px dashed var(--line);border-radius:var(--r);padding:30px 16px;text-align:center;background:linear-gradient(180deg,var(--surface),var(--surface-2));cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 6px 0 var(--depth),0 20px 30px -18px var(--drop);transition:transform .15s}
.drop:hover{transform:translateY(-2px)}
.drop.over{border-color:var(--leaf);background:var(--leaf-soft)}
.drop strong{font-family:var(--f-display);font-size:1.4rem}
.drop .ico{width:84px;height:84px;animation:bob 3s ease-in-out infinite}
.words{display:flex;flex-direction:column;gap:16px}
.wcard{display:grid;grid-template-columns:160px 1fr;gap:16px;padding:14px;position:relative}
.wcard.flag{box-shadow:inset 0 0 0 3px var(--sun),0 6px 0 var(--sun-depth),0 20px 30px -18px var(--drop)}
.wcard.dragging{opacity:.4}
.wcard.dropline{box-shadow:inset 0 4px 0 var(--leaf),0 6px 0 var(--depth)}
@media (max-width:560px){.wcard{grid-template-columns:100px 1fr}}
.pbox{display:flex;flex-direction:column;gap:6px}
.pbox .pic{cursor:pointer;outline:3px solid transparent;outline-offset:-3px;transition:transform .15s}
.pbox .pic:hover{transform:scale(1.03) rotate(-1deg)}
.pbox .pic.active{outline-color:var(--sky)}
.pbox .pic.over{outline-color:var(--leaf)}
.wfields{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.wfields .full{grid-column:1/-1}
@media (max-width:560px){.wfields{grid-template-columns:1fr}}
.wtools{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.handle{cursor:grab;font-weight:800;color:var(--muted);user-select:none;padding:4px 8px;border-radius:8px}
.picker{grid-column:1/-1;background:var(--surface-2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 3px 8px -4px var(--drop)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.gallery button{padding:0;border:0;border-radius:14px;background:var(--surface);aspect-ratio:1;cursor:pointer;overflow:hidden;box-shadow:0 4px 0 var(--depth)}
.gallery img{width:100%;height:100%;object-fit:contain}
.togs{display:flex;flex-wrap:wrap;gap:10px}
.tog{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:16px;cursor:pointer;font-weight:800;font-size:.92rem;background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 2px 0 var(--hi),0 4px 0 var(--depth)}
.tog input{accent-color:var(--leaf);width:20px;height:20px}
.tog .ico{width:28px;height:28px}
.bar{position:sticky;bottom:0;z-index:5;padding-block:12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:14px;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.qr{background:#fff;padding:14px;border-radius:20px;display:inline-block;width:max-content;max-width:100%;box-shadow:0 6px 0 #c9d6cc,0 20px 30px -18px rgba(0,0,0,.5)}
.qr img,.qr canvas{display:block;width:200px;height:200px}
.code{font-family:var(--f-display);font-weight:800;font-size:2.8rem;letter-spacing:.14em;color:var(--leaf);line-height:1;text-shadow:0 3px 0 var(--leaf-depth),0 10px 14px var(--drop)}
.copyline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyline input{flex:1;min-width:0}
.meter{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 3px 6px -2px var(--drop)}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,var(--leaf-hi),var(--leaf))}
.progress{display:flex;gap:10px;align-items:center;font-weight:800}
.spin{width:24px;height:24px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--leaf);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* student */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.lesson{display:flex;flex-direction:column;gap:12px;text-align:left;padding:14px;cursor:pointer;color:var(--ink);transition:transform .15s,box-shadow .15s}
.lesson:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:inset 0 2px 0 var(--hi),0 10px 0 var(--depth),0 28px 34px -18px var(--drop)}
.lesson:active{transform:translateY(3px)}
.lesson .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.game{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:18px;cursor:pointer;min-height:190px;color:var(--ink);transition:transform .15s,box-shadow .15s}
.game:hover{transform:translateY(-5px);box-shadow:inset 0 2px 0 var(--hi),0 10px 0 var(--depth),0 28px 34px -18px var(--drop)}
.game:active{transform:translateY(4px);box-shadow:inset 0 2px 0 var(--hi),0 2px 0 var(--depth)}
.pod{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;margin-bottom:6px;
  background:radial-gradient(100% 70% at 30% 15%,var(--sheen),transparent 60%),var(--tint,var(--t1));
  box-shadow:inset 0 3px 0 var(--sheen),inset 0 -7px 0 rgba(0,0,0,.08),0 10px 14px -8px var(--drop)}
.pod img{width:60px;height:60px;filter:drop-shadow(0 8px 5px rgba(0,0,0,.28));transition:transform .25s}
.game:hover .pod img{transform:translateY(-6px) scale(1.08) rotate(-8deg)}
.game strong{font-family:var(--f-display);font-size:1.3rem;line-height:1.1}
.game .stars{margin-top:auto}
.game.first{background:linear-gradient(180deg,var(--leaf-soft),var(--surface));box-shadow:inset 0 0 0 3px var(--leaf),0 6px 0 var(--leaf-depth),0 20px 30px -18px var(--drop)}
.game .chip{position:absolute;top:14px;right:14px}
.stars{display:flex;gap:2px}
.stars .ico{width:24px;height:24px}
.stars .off{filter:grayscale(1) opacity(.3)}
.gtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gtop h2{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.gtop h2 .ico{width:52px;height:52px}
.score{font-weight:800;font-family:var(--f-display);font-size:1.2rem;color:var(--leaf);background:var(--leaf-soft);padding:4px 14px;border-radius:999px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.score:empty{display:none}

.fc-stage{display:flex;flex-direction:column;align-items:center;gap:16px;perspective:1400px}
.fc{position:relative;width:min(420px,100%);aspect-ratio:3/4;cursor:pointer;border:0;background:none;padding:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}
.fc::before,.fc::after{content:"";position:absolute;inset:0;border-radius:28px;background:var(--surface-2);box-shadow:0 6px 0 var(--depth);transform:translateZ(-30px) rotate(3deg) translateY(10px)}
.fc::after{transform:translateZ(-60px) rotate(-4deg) translateY(18px);opacity:.7}
.fc-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center}

.mcard{aspect-ratio:1;border-radius:20px;border:0;cursor:pointer;display:grid;place-items:center;padding:6px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--ink);overflow:hidden;overflow-wrap:anywhere;margin-bottom:6px;

/* A link can be opened before the website has the new lesson (or the phone shows an old copy).
   Instead of failing, fetch the newest copy of the website and open the lesson as soon as it is there. */
var DATA_RE = new RegExp('<script id="fs-data" type="application/json">([\\s\\S]*?)<' + '/script>');
function fetchActivity(code){
  if (!/^[a-z0-9]{3,8}$/i.test(code || '')) return Promise.resolve(null);
  return fetch('activities/' + code.toLowerCase() + '.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(a){ return a && a.code && a.status === 'published' ? a : null; })
    .catch(function(){ return null; });
}
function fetchLatestData(){
  var url = location.pathname + '?fresh=' + Date.now();
  return fetch(url, {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
    var m = t && t.match(DATA_RE); return m ? JSON.parse(m[1]) : null;
  }).catch(function(){ return null; });
}
var waitTimer = null;
function waitForLesson(w, code){
  var started = Date.now(), tries = 0, LIMIT = 15*60*1000;
  var vi = LANG === 'vi';
  var status = h('p',{class:'small muted', 'aria-live':'polite', style:'text-align:center'}, '');
  var head = h('h2',{class:'t3d'}, vi ? 'Đang mở bài học…' : 'Opening your lesson…');
  var sub = h('p',{style:'font-weight:700;max-width:36ch'}, '');
  var card = h('div',{class:'who clay', style:'text-align:center;align-items:center'},
    growth(1), head, sub,
    h('div',{class:'progress', style:'justify-content:center'}, h('div',{class:'spin'}), h('span',null, vi ? 'Đang chuẩn bị bài học…' : 'Getting it ready…')),
    status);
  w.append(card);
  clearTimeout(waitTimer);
  function check(){
    if (view.name !== 'home' || view.missing !== code) return;
    tries++;
    fetchActivity(code).then(function(one){
      if (one) return {activities:[one]};
      return fetchLatestData();
    }).then(function(d){
      if (view.name !== 'home' || view.missing !== code) return;
      var a = d && (d.activities||[]).find(function(x){ return x.code === code && x.status === 'published'; });
      if (a) {
        DATA.activities = [a]; if (d.settings) DATA.settings = d.settings;
        if (tries > 1) playEv('ok');
        go({name:'hub', id:a.id});
        return;
      }
      head.textContent = vi ? 'Bài học sắp sẵn sàng!' : 'Your lesson is almost ready!';
      sub.textContent = vi ? 'Thầy cô vừa tạo bài học này. Em chờ một chút nhé, bài học sẽ tự mở ra.' : 'Your teacher just made this lesson. Please wait a moment. It will open by itself.';
      if (Date.now() - started > LIMIT) {
        card.textContent = '';
        card.append(I('question','medal'), h('h2',null, vi ? 'Chưa tìm thấy bài học' : "We can't find this lesson yet"),
          h('p',{style:'font-weight:700;max-width:36ch'}, vi ? 'Em hãy hỏi thầy cô xem đường link có đúng không nhé.' : 'Please ask your teacher to check the link.'),
          h('button',{class:'btn sm', onclick:function(){ location.reload(); }}, I('rotr'), vi ? 'Thử lại' : 'Try again'));
        return;
      }
      status.textContent = (vi ? 'Sẽ kiểm tra lại sau vài giây… (lần ' : 'Checking again in a few seconds… (check ') + tries + ')';
      waitTimer = setTimeout(check, tries < 2 ? 3000 : tries < 5 ? 8000 : 15000);
    });
  }
  check();
}

/* ---- Concept Quiz: answer, then always learn why ---- */
function gCQuiz(api){
  var a = api.a, qs = (a.questions || []).slice(), i = 0, right = 0, missed = [], review = false, vi = LANG === 'vi';
  function draw(){
    api.el.textContent = '';
    var list = review ? missed : qs;
    if (i >= list.length) return review ? endReview() : end();
    var q = list[i], answered = false;
    api.setScore(review ? (vi ? 'Ôn lại ' : 'Review ') + (i + 1) + '/' + list.length : (i + 1) + ' ' + t('of') + ' ' + list.length);
    var c = (a.concepts || [])[q.concept];
    var hintBox = h('div', {class:'note cq-hint', hidden:true});
    api.setHint(review || !c ? null : function(){
      hintBox.textContent = '';
      hintBox.append(h('div', {class:'cq-fb-head'}, I('bulb'), vi ? 'Nhớ lại ý chính:' : 'Remember this big idea:'),
        bi(a, c.title, c.title_vi, 'lc-title small-title'), bi(a, c.text, c.text_vi, ''));
      hintBox.hidden = false;
    });
    var opts = h('div', {class:'cq-opts'});
    var fb = h('div', {class:'cq-fb', 'aria-live':'polite'});
    var nextBtn = h('button', {class:'btn primary', hidden:true, onclick:function(){ i++; draw(); }},
      (i === list.length - 1 ? (vi ? 'Xong' : 'Finish') : (vi ? 'Câu tiếp' : 'Next question')) + ' →');
    (q.options || []).forEach(function(o, k){
      var b = h('button', {class:'opt cq-opt'}, h('span', {class:'cq-letter'}, 'ABCDE'.charAt(k)), bi(a, o, (q.options_vi || [])[k], 'cq-otext'));
      b.addEventListener('click', function(){
        if (answered) return;
        answered = true;
        var ok = k === q.answer;
        opts.querySelectorAll('.cq-opt').forEach(function(x, j){ x.disabled = true; if (j === q.answer) x.classList.add('ok'); });
        if (ok) { b.classList.add('ok'); beep('ok'); if (!review) right++; }
        else { b.classList.add('no'); beep('no'); if (!review) { api.mistakes++; missed.push(q); } }
        fb.textContent = '';
        fb.className = 'cq-fb ' + (ok ? 'good' : 'bad');
        fb.append(
          h('div', {class:'cq-fb-head'}, I(ok ? 'check' : 'bulb'), ok ? (vi ? 'Chính xác!' : 'Correct!') : (vi ? 'Chưa đúng. Cùng tìm hiểu nhé:' : 'Not quite. Here is why:')),
          ok ? null : bi(a, (vi ? 'Đáp án đúng: ' : 'The answer is: ') + q.options[q.answer], (q.options_vi || [])[q.answer] ? '→ ' + q.options_vi[q.answer] : '', 'cq-ans'),
          q.explain ? bi(a, q.explain, q.explain_vi, 'cq-explain') : null);
        nextBtn.hidden = false;
        setTimeout(function(){ try { fb.scrollIntoView({behavior:'smooth', block:'nearest'}); } catch(e){} }, 50);
      });
      opts.append(b);
    });
    api.el.append(
      h('div', {class:'qcard cq-card'},
        q.img ? h('img', {class:'cq-img', src:q.img, alt:''}) : null,
        bi(a, q.q, q.q_vi, 'qtext'),
        h('div', {class:'row', style:'justify-content:center'}, sayBtn((q.q || '') + ' ' + (q.options || []).map(function(o, k){ return 'ABCDE'.charAt(k) + '. ' + o; }).join('. '), true))),
      hintBox, opts, fb,
      h('div', {class:'row', style:'justify-content:center'}, nextBtn));
  }
  function end(){
    var pct = qs.length ? Math.round(right / qs.length * 100) : 0;
    api.score = pct;
    api.stars = pct >= 90 ? 3 : pct >= 60 ? 2 : 1;
    api.doneNote = right + ' / ' + qs.length + (vi ? ' câu đúng · ' : ' correct · ') + pct + '%';
    api.extraDone = missed.length ? function(){
      return h('button', {class:'btn sun', onclick:function(){ review = true; i = 0; api.setScore(''); draw(); }}, I('bulb'),
        vi ? 'Ôn lại ' + missed.length + ' câu sai' : 'Review the ' + missed.length + (missed.length === 1 ? ' question' : ' questions') + ' I missed');
    } : null;
    api.finish();
  }
  function endReview(){
    api.setHint(null); api.setScore('');
    api.el.append(h('div', {class:'done-box'},
      I('brain', 'medal'),
      h('h2', {class:'t3d'}, vi ? 'Ôn tập xong rồi!' : 'Review done!'),
      h('p', {class:'muted', style:'font-weight:700;max-width:36ch'}, vi ? 'Bây giờ em đã sẵn sàng cho bài học trên lớp.' : 'You are ready for the lesson in class.'),
      h('div', {class:'row', style:'justify-content:center'},
        h('button', {class:'btn primary', onclick:function(){ go({name:'hub', id:a.id}); }}, t('menu')))));
    playEv('done');
  }
  draw();
}

/* ---- 2 picture match ---- */

function chunk(a,n){ var o=[]; for (var i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); if (o.length>1 && o[o.length-1].length<2){ var l=o.pop(); o[o.length-1]=o[o.length-1].concat(l); } return o; }

/* ---- generic multiple choice ---- */

/* ---- 8 word search ---- */
function gSearch(api){

  var chosen = sample(pool, Math.min(8, pool.length));

    for (var tries=0; tries<200; tries++){

      var x0 = Math.floor(Math.random()*(N - d[0]*(s.length-1))), y0 = Math.floor(Math.random()*(N - d[1]*(s.length-1)));

    });
    box.append(b);
  })(x,y);

}

/* ---- file reading ---- */
async function readLessonFile(file){
  var name = (file.name || 'picture.png').toLowerCase(), out = {text:'', images:[], gallery:[]};
  if (/\.(ppt|doc|key|pages)$/.test(name)) throw new Error('Please save this file as .pptx, .docx or PDF first (File → Save As), then upload it again.');
  if (/\.(txt|md)$/.test(name)) { out.text = await file.text(); return out; }
  if (/\.(png|jpe?g|webp)$/.test(name) || /^image\//.test(file.type)) {
    out.images = [await toJpegBlob(file, 1600)]; out.gallery = [await compressImage(file, 480)]; return out;
  }
  if (/\.pdf$/.test(name)) return readPdf(file);
  if (/\.(pptx|docx)$/.test(name)) {
    await loadScript(LIBS.zip);
    var zip = await window.JSZip.loadAsync(file);
    var isPpt = /\.pptx$/.test(name);
    var paths = Object.keys(zip.files);
    var textFiles = paths.filter(function(p){ return isPpt ? /^ppt\/(slides|notesSlides)\/[a-zA-Z]+\d+\.xml$/.test(p) : /^word\/document\.xml$/.test(p); })
      .sort(function(a,b){ return (a.indexOf('notes')>=0) - (b.indexOf('notes')>=0) || (+a.replace(/\D/g,'')) - (+b.replace(/\D/g,'')); });
    var parts = [];
    for (var i=0;i<textFiles.length;i++){
      var xml = await zip.file(textFiles[i]).async('string');
      var tag = isPpt ? 'a:t' : 'w:t';
      var paraTag = isPpt ? '</a:p>' : '</w:p>';
      var txt = xml.split(paraTag).map(function(p){ var m = p.match(new RegExp('<'+tag+'[^>]*>([^<]*)</'+tag+'>','g')) || []; return m.map(function(s){return s.replace(/<[^>]+>/g,'')}).join(''); }).filter(Boolean).join('\n');
      txt = txt.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
      if (txt.trim()) parts.push((isPpt ? (textFiles[i].indexOf('notes')>=0?'[Notes] ':'[Slide '+textFiles[i].replace(/\D/g,'')+'] ') : '') + txt);
    }
    out.text = parts.join('\n\n');
    var media = paths.filter(function(p){ return /^(ppt|word)\/media\/.+\.(png|jpe?g|gif|webp)$/i.test(p); }).slice(0, 40);
    for (i=0;i<media.length;i++){
      try { var b = await zip.file(media[i]).async('blob'); if (b.size < 2500) continue; var ext = media[i].split('.').pop().toLowerCase(); b = new Blob([b], {type:'image/'+(ext==='jpg'?'jpeg':ext)}); out.gallery.push(await compressImage(b, 480)); } catch(e){}
    }
    return out;
  }
  throw new Error('FLIPSEED can read PDF, PowerPoint (.pptx), Word (.docx), text files and photos.');
}
async function readPdf(file){
  await loadScript(LIBS.pdf);
  var pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  var doc = await pdfjs.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  var out = {text:'', images:[], gallery:[]}, parts = [];
  var n = Math.min(doc.numPages, 60);
  for (var p=1;p<=n;p++){
    var page = await doc.getPage(p), tc = await page.getTextContent();
    var s = tc.items.map(function(i){return i.str}).join(' ').replace(/\s+/g,' ').trim();
    if (s) parts.push('[Page '+p+'] '+s);
  }
  out.text = parts.join('\n');
  var maxImgs = 5;
  try { var lim = await CAP.sample.limits(); if (lim && lim.images) maxImgs = Math.min(maxImgs, lim.images.maxCount); else maxImgs = 0; } catch(e){}
  var needImgs = out.text.length < 300 * Math.min(n, 3);
  var pages = needImgs ? Math.min(doc.numPages, maxImgs) : 0;
  for (p=1;p<=pages;p++){
    var pg = await doc.getPage(p), vp = pg.getViewport({scale:1}); var sc = 1400/Math.max(vp.width, vp.height);
    var v2 = pg.getViewport({scale:sc}), c = document.createElement('canvas'); c.width = v2.width; c.height = v2.height;
    await pg.render({canvasContext:c.getContext('2d'), viewport:v2}).promise;
    var blob = await new Promise(function(r){ c.toBlob(r, 'image/jpeg', 0.82); });
    if (blob) out.images.push(blob);
  }
  return out;
}
function toJpegBlob(file, max){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ var sc=Math.min(1,max/Math.max(im.width,im.height)); var c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(res,'image/jpeg',0.85); };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('That picture could not be opened.')); };
    im.src = url;
  });
}

function normComic(arr, both){
  return (Array.isArray(arr) ? arr : []).filter(function(p){ return p && p.say; }).slice(0, 6).map(function(p){
    return {who: p.who === 'kid' ? 'kid' : 'seed', mood: ['happy','wonder','wow'].indexOf(p.mood) >= 0 ? p.mood : 'happy',
      scene: String(p.scene || '').trim().slice(0, 24), say: String(p.say).trim(), say_vi: both ? String(p.say_vi || '').trim() : ''};
  });
}
var COMIC_RULES = 'Each big idea is taught as a short COMIC STRIP: "comic" is a list of 3 to 5 panels, a friendly conversation between Bin (a curious Vietnamese student, "who":"kid") and Seedy (a cheerful talking seed who is a Science guide, "who":"seed"). ' +
  'Panel 1: Bin notices something from everyday life in Vietnam or asks a question (make the child curious). Middle panels: Seedy explains the idea in tiny, clear steps, maybe with a quick "try this" or "look!". Last panel: Bin says the idea in his own words or gives his own example, and is happy. ' +
  'Together the panels must teach everything in the big idea "text", accurately. "say": ONE short line, max 15 easy words. "mood": "wonder", "happy" or "wow". "scene": 1 to 3 emojis that show what is happening in that panel (no text, no faces of Bin or Seedy).';
function comicRulesVi(both){ return both ? ' Add "say_vi": a natural Vietnamese translation of each line.' : ' "say_vi" is an empty string.'; }

function normQuiz(res, both){
  var cs = (res && res.concepts || []).filter(function(c){ return c && c.title && c.text; }).slice(0, 8).map(function(c){
    return {id:uid(), title:String(c.title).trim(), text:String(c.text).trim(), example:String(c.example || '').trim(), emoji:String(c.emoji || '💡').trim().slice(0, 8),
      title_vi: both ? String(c.title_vi || '').trim() : '', text_vi: both ? String(c.text_vi || '').trim() : '', example_vi: both ? String(c.example_vi || '').trim() : '', img:'', comic: normComic(c.comic, both)};
  });
  var qs = (res && res.questions || []).map(function(q){
    if (!q || !q.q || !Array.isArray(q.options)) return null;
    var tf = q.type === 'tf' || (q.options.length === 2 && /^(true|false)$/i.test(String(q.options[0]).trim()));
    var opts = tf ? ['True', 'False'] : q.options.map(function(o){ return String(o).trim(); }).filter(Boolean).slice(0, 5);
    var optsVi = both ? (tf ? ['Đúng', 'Sai'] : (q.options_vi || []).map(function(o){ return String(o || '').trim(); }).slice(0, opts.length)) : [];
    var ans = parseInt(q.answer, 10);
    if (tf && typeof q.answer === 'string' && isNaN(ans)) ans = /^t/i.test(q.answer) ? 0 : 1;
    if (!(ans >= 0 && ans < opts.length) || opts.length < 2) return null;
    var ci = parseInt(q.concept, 10);
    return {id:uid(), type: tf ? 'tf' : 'mc', q:String(q.q).trim(), q_vi: both ? String(q.q_vi || '').trim() : '', options:opts, options_vi:optsVi, answer:ans,
      explain:String(q.explain || '').trim(), explain_vi: both ? String(q.explain_vi || '').trim() : '', concept: ci >= 0 && ci < cs.length ? ci : 0, img:''};
  }).filter(Boolean);
  return {title: String(res && res.title || '').trim(), concepts: cs, questions: qs};
}

async function extractQuiz(content, grade, topic, count, both){

    'This is a FLIPPED CLASSROOM pre-lesson. Students do it at home BEFORE the teacher teaches the lesson, so it must first TEACH the key concepts simply, then gently check understanding.',
    topic ? 'The teacher says the topic is: ' + topic + '.' : '',
    'From the book pages / lesson below, create:',
    '1. "concepts": 3 to 6 "big idea" cards covering the main concepts of THIS lesson, in lesson order. Each has "title" (max 6 words), "text" (1 to 3 short, simple sentences that explain the idea, max 40 words), "example" (one everyday example a child knows, max 15 words), "emoji" (one emoji), and "comic" (see below).',
    COMIC_RULES + comicRulesVi(both),
    '2. "questions": exactly ' + count + ' questions that check understanding of those concepts. About 3 in 4 are multiple choice with 4 options ("type":"mc"); the rest are true/false ("type":"tf", options exactly ["True","False"]).',
    '   Every question must be answerable from the concept cards alone, because the students have not had the lesson yet. Test understanding (apply, compare, predict, explain why), not only memory. Use simple words. Exactly one clearly correct answer. Wrong options should be common misconceptions, never silly. No "all of the above". Vary the position of the correct answer.',
    '   "answer": index of the correct option (0-based). "explain": 1 to 2 friendly sentences that teach why the answer is right. "concept": index of the concept card the question checks.',
    both ? 'Also add natural Vietnamese translations, as used in Vietnamese Science textbooks: "title_vi", "text_vi", "example_vi" on each concept, and "q_vi", "options_vi" (same order as options), "explain_vi" on each question. For true/false use ["Đúng","Sai"].' : 'Leave every *_vi field as an empty string.',
    '"title": a short activity title (max 6 words).',
    'Be scientifically accurate. Stay within the content of these pages. Do not invent facts.',
    'Return ONLY JSON in this shape:',
    '{"title":"","concepts":[{"title":"","text":"","example":"","emoji":"","title_vi":"","text_vi":"","example_vi":"","comic":[{"who":"kid","mood":"wonder","scene":"","say":"","say_vi":""}]}],"questions":[{"type":"mc","q":"","options":["","","",""],"answer":0,"explain":"","concept":0,"q_vi":"","options_vi":[],"explain_vi":""}]}',
    '',
    'LESSON CONTENT:',
    text || '(The lesson pages are attached as pictures. Read them carefully, including diagrams, labels and captions.)'
  ].join('\n');
  var opts = {modelTier:'default'};

}

async function aiTranslateQuiz(act){

  var prompt = 'Translate this children\'s Science lesson material (Grade ' + act.grade + ', Vietnamese students) into natural Vietnamese, as used in Vietnamese Science textbooks. Keep it simple. For "True"/"False" use "Đúng"/"Sai".\n' +
    'Return ONLY JSON: {"concepts":[{"title_vi":"","text_vi":"","example_vi":"","comic_vi":["one Vietnamese line per comic line"]}],"questions":[{"q_vi":"","options_vi":[],"explain_vi":""}]} with the same number and order of items and options.\n\n' + JSON.stringify(payload);
  var r = await CAP.sample.json(prompt, {modelTier:'default'});

    'Questions they already have (do not repeat them):\n' + act.questions.map(function(q){ return '- ' + q.q; }).join('\n') + '\n' +

/* ---- AI ---- */
async function extractVocab(content, grade, topic, count, vi){
  var text = content.text.slice(0, 60000);
  var level = +grade <= 2 ? 'A1 (very young learners: 5–8 very easy words per meaning)' : +grade <= 5 ? 'A1–A2' : 'A2–B1';
  var prompt = [
    'You help a Science teacher at a bilingual school in Hanoi, Vietnam. Students are Vietnamese children learning Science in English.',
    'Task: from the lesson below, choose the '+count+' most important Science vocabulary words or short phrases that students must know BEFORE the lesson starts (flipped classroom). Grade '+grade+'. English level for definitions: '+level+'.',
    topic ? 'The teacher says the topic is: '+topic+'.' : '',
    'Rules:',
    '- Pick words that carry the Science ideas of THIS lesson, not general words like "look" or "page".',
    '- Use the Science meaning of each word.',
    '- "meaning": one short, simple sentence (max 12 words) using only words easier than the word itself. Do not use the word itself in its meaning.',
    '- "example": one short sentence (max 12 words) about the lesson that contains the exact word.',
    '- "vi": '+(vi ? 'the Vietnamese translation of the word as Vietnamese primary Science textbooks would say it.' : 'empty string.'),
    '- "emoji": one emoji that best shows the word to a child (a picture placeholder).',
    '- "categories": if the words naturally split into 2–3 groups taught in the lesson (e.g. "Living", "Non-living"), list the group names; otherwise an empty list. "category": the group name for each word, or "".',
    '- "check": true only if the lesson does not make the meaning clear and the teacher should check it.',
    '- "title": a short, child-friendly activity title (max 6 words).',
    'Never invent facts that are not true. Return ONLY JSON in this shape:',
    '{"title":"","categories":[],"words":[{"word":"","meaning":"","example":"","vi":"","emoji":"","category":"","check":false}]}',
    '',
    'LESSON CONTENT:',
    text || '(The lesson is in the attached pictures. Read them.)'
  ].join('\n');
  var opts = {modelTier:'default'};
  if (content.images && content.images.length) opts.images = content.images;
  return CAP.sample.json(prompt, opts);
}
async function aiFillWord(w, grade, vi, lessonTitle){
  var prompt = 'You help a Science teacher in Vietnam make vocabulary flashcards for Grade '+grade+' English learners (CEFR '+(+grade<=5?'A1–A2':'A2–B1')+'). Lesson: "'+lessonTitle+'". Word: "'+w.word+'".\n' +
    'Return ONLY JSON: {"meaning":"one simple sentence, max 12 words, Science meaning, without using the word","example":"short lesson sentence containing the exact word","vi":"'+(vi?'Vietnamese translation of the word':'')+'","emoji":"one emoji that shows the word"}';
  return CAP.sample.json(prompt, {modelTier:'quick'});
}
async function aiDraw(w){
  var prompt = 'Draw a simple, friendly, colourful flat illustration for young children that clearly shows: "'+w.word+'" ('+(w.meaning||'a Science word')+').\n' +
    'Rules: one SVG, viewBox="0 0 240 240", a soft pastel circle or rounded square as background, bold simple shapes with dark outlines (stroke-width 3), bright cheerful colours, scientifically correct, NO text, letters or numbers, no <script>, no <image>, no <style>, no filters, no gradients, under 40 shapes.\n' +
    'Return ONLY JSON: {"svg":"<svg ...>...</svg>"}';
  var r = await CAP.sample.json(prompt, {modelTier:'default'});
  var d = sanitizeSvg(r && r.svg);
  if (!d) throw new Error('The drawing came back broken. Try again.');
  return d;
}

function tEdit(w){
  var saved = findAct(view.id);
  var act = view.draft || null;
  var wip = loadWip(view.id);
  if (!act) {
    if (view.restore && wip) act = wip.act;
    else if (saved) act = JSON.parse(JSON.stringify(saved));
    else if (wip) act = wip.act;
  }
  if (!act) return go({name:'studio'});
  view.draft = act; PREVIEW = null;
  if (isQuiz(act)) return tEditQuiz(w, act);
  w.append(topBar(false));
  var dirty = false;
  function touch(){ dirty = true; act.updated = Date.now(); saveWip(act); }

  w.append(h('div',{class:'stack', style:'gap:4px;margin-bottom:14px'},
    h('div',{class:'eyebrow'}, (act.status==='published'?'Live activity':'Draft')+' · code '+act.code),
    h('h1',{class:'t3d'},'Check the words and pictures')));
  if (wip && !view.restore && saved && wip.t > (saved.updated||0) + 1000 && !view.dismissed)
    w.append(h('p',{class:'note warn', style:'margin-bottom:12px'}, 'You have unsaved edits from earlier. ',

/* ---- saving: the page republishes itself ---- */
function buildHtml(data){
  var json = JSON.stringify(data || DATA).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return SKELETON + HEAD_SRC +
    '<style id="fs-style">' + SRC_STYLE + '</style>\n<div id="app"></div>\n' +
    '<script id="fs-data" type="application/json">' + json + '<\/script>\n' +
    '<script id="fs-icons" type="application/json">' + SRC_ICONS + '<\/script>\n' +
    '<script id="fs-app">' + SRC_APP + '<\/script>\n</body></html>';
}
var saving = false;
function syncWebsite(){
  if (!isSiteLink()) return;
  var note = function(m, ms){ toast(m, ms || 6000); };
  if (!CAP.mcp) { note('Saved. Your student website updates within the hour.'); return; }
  lsSet('fs:syncAt', String(Date.now()));
  CAP.mcp.callTool('Claude Code Remote', 'fire_trigger', {trigger_id: SYNC_TASK}).then(function(){
    note('Saved. Your student website is updating now and will be ready in about 3 minutes.', 7000);
    render();
  }, function(e){
    var c = e && e.code;
    if (c === 'approval_required' || c === 'not_in_manifest') note('Saved. To update your website straight away next time, click Allow when Claude asks. For now it updates within the hour.', 8000);
    else if (c === 'server_not_connected' || c === 'needs_reauth') note('Saved. Your website updates within the hour. (Instant updates need GitHub/Claude Code connected in claude.ai Settings → Connectors.)', 8000);
    else note('Saved. Your student website updates within the hour.');
  });
}
async function savePage(nextView, okMsg, onOk){
  if (saving) return; saving = true;
  if (!CAP.artifact) { saving=false; toast('Saving works only when you open FLIPSEED in Claude as its owner.', 4000); return; }
  var html = buildHtml();
  if (html.length > MAX_BYTES - 200000) { saving=false; toast('FLIPSEED is full. Delete an old activity or use fewer uploaded photos, then save again.', 5000); return; }
  ssSet('fs:return', JSON.stringify({view:nextView, msg:okMsg, sync:true}));
  showSaving();
  if (onOk) onOk();
  try {
    await CAP.artifact.publish(html);
  } catch(e) {
    hideSaving(); saving = false; ssDel('fs:return');
    var c = e && e.code;
    if (c === 'conflict') { toast('FLIPSEED was changed somewhere else. Reloading the newest version…', 4000); return; }
    if (c === 'not_writer' || c === 'not_granted' || c === 'capability_disabled') { toast('This copy of FLIPSEED is read-only for you, so changes cannot be saved here.', 5000); return; }
    if (c === 'too_large') { toast('FLIPSEED is full. Delete an old activity, then save again.', 5000); return; }
    if (c === 'rate_limited') { toast('Saving too often. Wait a moment and try again.', 4000); return; }
    toast('Saving failed. Your edits are kept on this computer; try again in a moment.', 5000);
  }
}

function routeFromHash(){
  var c = (location.hash||'').replace('#','');
  if (c === 'results') return {name:'results'};
  var a = c && findByCode(c);
  if (!a && c && /^[a-z0-9]{3,6}$/i.test(c)) return {name:'home', missing:c};
  return a ? {name:'hub', id:a.id} : null;
}
setTimeout(flushTrack, 1500);
var start = routeFromHash() || (DATA.standalone && DATA.activities[0] ? {name:'hub', id:DATA.activities[0].id} : null);
if (start) view = start;
render();
window.addEventListener('hashchange', function(){ var r = routeFromHash(); if (r) go(r); });

(async function initCaps(){
  if (!window.claude || !window.claude.use) return;
  var names = ['user','artifact','sample','downloads','mcp'];
  var got = await Promise.all(names.map(function(n){ return window.claude.use(n).catch(function(){return null}); }));
  CAP.user = got[0]; CAP.artifact = got[1]; CAP.sample = got[2]; CAP.downloads = got[3]; CAP.mcp = got[4];
  var edit = false;
  try { edit = CAP.user ? !!(await CAP.user.canEdit()) : false; } catch(e){}
  if (!edit) { CAP.sample = null; return; }
  IS_TEACHER = true;
  var ret = null; try { ret = JSON.parse(ssGet('fs:return')); } catch(e){}
  ssDel('fs:return');
  if (ret && ret.view) { go(ret.view); if (ret.sync && isSiteLink()) syncWebsite(); else if (ret.msg) toast(ret.msg); }
  else if (!start) go({name:'studio'});
  else render();
})();
})();
</script>
