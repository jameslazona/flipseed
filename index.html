<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FLIPSEED</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style id="fs-style">
/* Layout: a sunny clay garden. One centred column of chunky, pressable 3D tiles; studio = work bench, student side = big floating game tiles. */
:root{
  --bg:#e4f4ea; --bg1:#d6edff; --bg2:#e8f7e3; --blob1:rgba(255,205,70,.38); --blob2:rgba(72,200,125,.26); --blob3:rgba(110,170,255,.30);
  --surface:#ffffff; --surface-2:#f1f8f2; --ink:#14301e; --muted:#557064; --line:#d2e3d6;
  --depth:#c3d8c9; --drop:rgba(20,60,35,.35); --hi:rgba(255,255,255,.95); --sheen:rgba(255,255,255,.65);
  --leaf:#23864f; --leaf-hi:#55d48c; --leaf-depth:#146238; --leaf-soft:#d5f2df; --on-leaf:#ffffff;
  --sun:#ffc12e; --sun-hi:#ffe27d; --sun-depth:#c98a00; --sun-soft:#fff0c0; --on-sun:#3a2900;
  --sky:#2f7fd6; --sky-hi:#7fc0ff; --sky-depth:#1b5aa0; --sky-soft:#dcecfd;
  --coral:#d9513a; --coral-soft:#fde0d8; --plum:#7a55c9;
  --t1:#cfe6ff; --t2:#ffeeb5; --t3:#cff2dc; --t4:#ffd9cc; --t5:#e7dcff; --t6:#c9f1f1;
  --logo-1:#0f5a3a; --logo-2:#5cb83a; --plate:#ffffff;
  --sky-top:#9fd8ff; --sky-mid:#cdeeff; --sky-bot:#eefaf0; --sunc:#ffe066; --sun-glow:rgba(255,214,80,.55); --cloud:rgba(255,255,255,.92); --hill1:#c9efb4; --hill2:#a3e08c; --hill3:#7cc96f; --hill-dot:#ffd23f; --doodle-op:.5; --star-op:0; --bubble:rgba(255,255,255,.75);
  --f-display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1711; --bg1:#0c1b2a; --bg2:#0c1a12; --blob1:rgba(255,190,40,.10); --blob2:rgba(60,190,110,.14); --blob3:rgba(80,140,255,.14);
  --surface:#1a2e23; --surface-2:#142519; --ink:#e4f2e8; --muted:#a2bcab; --line:#2b4537;
  --depth:#07120c; --drop:rgba(0,0,0,.7); --hi:rgba(255,255,255,.08); --sheen:rgba(255,255,255,.07);
  --leaf:#46b876; --leaf-hi:#5fd48f; --leaf-depth:#0d4426; --leaf-soft:#1c3d2a; --on-leaf:#ffffff;
  --sun:#ffcd4f; --sun-hi:#ffdf80; --sun-depth:#8f6300; --sun-soft:#3b3214; --on-sun:#2d2000;
  --sky:#5ea6f0; --sky-hi:#86c0ff; --sky-depth:#174a80; --sky-soft:#17314d;
  --coral:#f07c64; --coral-soft:#46231c; --plum:#ae92f3;
  --t1:#1d3652; --t2:#3e3518; --t3:#1d4029; --t4:#472a21; --t5:#30284d; --t6:#173f3f; --logo-1:#7fdca0; --logo-2:#b6e86a; --plate:#f7fbf4; --sky-top:#071226; --sky-mid:#0c1d33; --sky-bot:#0e2219; --sunc:#f4f1d9; --sun-glow:rgba(240,235,200,.18); --cloud:rgba(255,255,255,.05); --hill1:#173d29; --hill2:#123222; --hill3:#0d281a; --hill-dot:#e9d27a; --doodle-op:.28; --star-op:1; --bubble:rgba(150,220,255,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1711; --bg1:#0c1b2a; --bg2:#0c1a12; --blob1:rgba(255,190,40,.10); --blob2:rgba(60,190,110,.14); --blob3:rgba(80,140,255,.14);
  --surface:#1a2e23; --surface-2:#142519; --ink:#e4f2e8; --muted:#a2bcab; --line:#2b4537;
  --depth:#07120c; --drop:rgba(0,0,0,.7); --hi:rgba(255,255,255,.08); --sheen:rgba(255,255,255,.07);
  --leaf:#46b876; --leaf-hi:#5fd48f; --leaf-depth:#0d4426; --leaf-soft:#1c3d2a; --on-leaf:#ffffff;
  --sun:#ffcd4f; --sun-hi:#ffdf80; --sun-depth:#8f6300; --sun-soft:#3b3214; --on-sun:#2d2000;
  --sky:#5ea6f0; --sky-hi:#86c0ff; --sky-depth:#174a80; --sky-soft:#17314d;
  --coral:#f07c64; --coral-soft:#46231c; --plum:#ae92f3;
  --t1:#1d3652; --t2:#3e3518; --t3:#1d4029; --t4:#472a21; --t5:#30284d; --t6:#173f3f; --logo-1:#7fdca0; --logo-2:#b6e86a; --plate:#f7fbf4; --sky-top:#071226; --sky-mid:#0c1d33; --sky-bot:#0e2219; --sunc:#f4f1d9; --sun-glow:rgba(240,235,200,.18); --cloud:rgba(255,255,255,.05); --hill1:#173d29; --hill2:#123222; --hill3:#0d281a; --hill-dot:#e9d27a; --doodle-op:.28; --star-op:1; --bubble:rgba(150,220,255,.25); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  background-color:var(--sky-bot);
  background-image:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 45%,var(--sky-bot) 80%);
  background-attachment:fixed}
#app{position:relative;z-index:1}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx .dots{position:absolute;inset:0;background-image:radial-gradient(var(--sheen) 1.5px,transparent 1.6px);background-size:28px 28px;opacity:.5;mask-image:linear-gradient(180deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%)}
.bgfx .sun{position:absolute;right:6%;top:5%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7c2,var(--sunc) 55%);box-shadow:0 0 0 18px var(--sun-glow),0 0 80px 40px var(--sun-glow);animation:glow 6s ease-in-out infinite}
.bgfx .rays{position:absolute;right:calc(6% - 90px);top:calc(5% - 90px);width:300px;height:300px;border-radius:50%;background:repeating-conic-gradient(var(--sun-glow) 0 8deg,transparent 8deg 22deg);mask-image:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 60s linear infinite;opacity:.7}
.bgfx .cloud{position:absolute;width:220px;height:70px;border-radius:999px;background:var(--cloud);filter:drop-shadow(0 8px 10px rgba(40,90,140,.12));animation:drift linear infinite}
.bgfx .cloud::before,.bgfx .cloud::after{content:"";position:absolute;background:var(--cloud);border-radius:50%}
.bgfx .cloud::before{width:100px;height:100px;left:34px;top:-48px}
.bgfx .cloud::after{width:74px;height:74px;left:112px;top:-30px}
.bgfx .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:min(30vh,260px)}
.bgfx .doodle{position:absolute;opacity:var(--doodle-op);filter:drop-shadow(0 10px 8px rgba(0,0,0,.18));animation:floaty ease-in-out infinite alternate}
.bgfx .bubble{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),var(--bubble) 40%,transparent 70%);box-shadow:inset 0 0 0 2px var(--bubble);animation:rise linear infinite}
.bgfx .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:var(--star-op);box-shadow:0 0 6px 1px rgba(255,255,255,.8);animation:twinkle 3s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(calc(100vw + 260px))}}
@keyframes floaty{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-26px) rotate(8deg)}}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}50%{transform:translateY(-55vh) translateX(18px)}100%{transform:translateY(-110vh) translateX(-10px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{transform:scale(1.06)}}
@keyframes twinkle{50%{transform:scale(.4);filter:brightness(.6)}}
@media (max-width:640px){.bgfx .sun{width:80px;height:80px;right:4%;top:3%}.bgfx .rays{display:none}.bgfx .doodle{opacity:calc(var(--doodle-op)*.6)}.bgfx .cloud{transform-origin:left;scale:.7}}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.4vw,2.9rem);font-weight:800}
h2{font-size:clamp(1.45rem,3.8vw,1.9rem);font-weight:800}
h3{font-size:1.22rem;font-weight:800}
p{margin:0}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
.t3d{color:var(--ink);text-shadow:0 2px 0 var(--sheen),0 4px 0 var(--depth),0 10px 16px var(--drop)}

/* 3D surfaces */
.clay,.panel,.lesson,.game,.act-row,.wcard,.qcard,.tile,.opt,.fc-face,.cert,.letter,.bin,.langs,.ws-board,.stat{
  background:linear-gradient(180deg,var(--surface),var(--surface-2));border:0;border-radius:var(--r);
  box-shadow:inset 0 2px 0 var(--hi),0 6px 0 var(--depth),0 20px 30px -18px var(--drop)}
.ico{display:inline-block;width:1.6em;height:1.6em;object-fit:contain;flex:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2));vertical-align:middle}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 20px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.05em;color:var(--leaf);background:none;border:0;padding:0;cursor:pointer;text-shadow:0 2px 0 var(--sheen),0 3px 0 var(--leaf-depth),0 8px 12px var(--drop)}
.brand .w1{color:var(--logo-1)}.brand .w2{color:var(--logo-2)}
.brand{color:var(--logo-1);text-shadow:0 2px 0 var(--sheen),0 3px 0 var(--depth),0 8px 12px var(--drop);gap:10px}
.plate{display:inline-grid;place-items:center;background:var(--plate);border-radius:16px;padding:3px 6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 5px 0 var(--depth),0 12px 18px -10px var(--drop);transition:transform .25s}
.brand .plate img{width:58px;height:auto;display:block}
.brand:hover .plate{transform:rotate(-6deg) scale(1.06)}
.hero-logo{flex:0 0 250px;max-width:100%;padding:12px;background:var(--plate);border-radius:30px;transform:rotate(-2deg);box-shadow:inset 0 3px 0 rgba(255,255,255,.9),0 8px 0 var(--depth),0 26px 34px -18px var(--drop);animation:bob 4.5s ease-in-out infinite;position:relative;z-index:1}
.hero-logo img{display:block;width:100%;height:auto;border-radius:18px}
@media (max-width:560px){.hero-logo{flex-basis:auto;width:min(230px,70%);margin:0 auto}}
[hidden]{display:none!important}
.linkstrip{margin-top:4px}
.hintbtn{margin-bottom:6px}
.gone-opt{opacity:.25!important;filter:grayscale(1);pointer-events:none;transform:scale(.96)}
.glowhint{animation:glowhint 1.3s ease-in-out 2}
@keyframes glowhint{0%,100%{box-shadow:inset 0 0 0 3px var(--sun),0 6px 0 var(--sun-depth)}50%{box-shadow:inset 0 0 0 5px var(--sun),0 0 0 8px var(--sun-soft),0 6px 0 var(--sun-depth);transform:translateY(-3px)}}
.zone{display:flex;align-items:center;gap:16px;width:100%;margin-top:22px;padding:16px 18px;border:0;border-radius:var(--r);cursor:pointer;text-align:left;color:var(--ink);
  background:radial-gradient(400px 160px at 0% 0%,var(--sun-soft),transparent 70%),linear-gradient(135deg,var(--surface),var(--t5));box-shadow:inset 0 0 0 3px var(--sun),0 6px 0 var(--sun-depth),0 20px 30px -18px var(--drop);transition:transform .15s}
.zone:hover{transform:translateY(-4px)}
.zone strong{font-family:var(--f-display);font-size:1.45rem;line-height:1.1}
.zone .pod{flex:none}
.zone-best{display:flex;align-items:center;gap:6px;flex:none;font-family:var(--f-display)}
.zone-best b{display:block;font-size:1.6rem;line-height:1}
.zone-best small{display:block;font-size:.75rem;color:var(--muted)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-radius:18px;font-family:var(--f-display);font-size:1.3rem}
.hud .ico{width:30px;height:30px}
.meter.timer i{transition:width 1s linear}
.meter.timer i.low{background:linear-gradient(180deg,#ff9b85,var(--coral))}
.big-inp{font-family:var(--f-display);font-size:1.6rem;font-weight:800;min-height:58px;text-align:center;letter-spacing:.04em}
.big-inp.right{border-color:var(--leaf);background:var(--leaf-soft)}
.big-inp.wrong{border-color:var(--coral);background:var(--coral-soft);animation:shake .35s}
.bigscore{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--leaf);text-shadow:0 3px 0 var(--leaf-depth),0 10px 14px var(--drop)}
.bigscore small{font-size:1.2rem;color:var(--muted);text-shadow:none}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--surface-2);box-shadow:inset 0 3px 8px -5px var(--drop)}
.stepn{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--on-leaf);background:linear-gradient(180deg,var(--leaf-hi),var(--leaf));box-shadow:0 3px 0 var(--leaf-depth)}
.linkstrip .inp{min-height:40px;font-size:.9rem;font-weight:700;color:var(--sky)}
.cert .cert-logo{width:170px;height:auto;border-radius:16px;background:var(--plate);padding:6px;box-shadow:0 5px 0 var(--depth)}
.top .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* clay buttons */
.btn{--b1:var(--surface);--b2:var(--surface-2);--bd:var(--depth);--bt:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 20px;margin-bottom:6px;border:0;border-radius:18px;
  background:linear-gradient(180deg,var(--b1),var(--b2));color:var(--bt);font-weight:800;cursor:pointer;text-decoration:none;
  box-shadow:inset 0 2px 0 var(--hi),0 6px 0 var(--bd),0 14px 18px -10px var(--drop);transition:transform .1s,box-shadow .1s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(5px);box-shadow:inset 0 2px 0 var(--hi),0 1px 0 var(--bd),0 4px 8px -6px var(--drop)}
.btn.primary{--b1:var(--leaf-hi);--b2:var(--leaf);--bd:var(--leaf-depth);--bt:var(--on-leaf);--hi:rgba(255,255,255,.4)}
.btn.sun{--b1:var(--sun-hi);--b2:var(--sun);--bd:var(--sun-depth);--bt:var(--on-sun);--hi:rgba(255,255,255,.5)}
.btn.sky{--b1:var(--sky-hi);--b2:var(--sky);--bd:var(--sky-depth);--bt:#fff;--hi:rgba(255,255,255,.4)}
.btn.ghost{background:transparent;box-shadow:none;margin-bottom:0}
.btn.ghost:active{transform:none}
.btn.danger{--bt:var(--coral)}
.btn.sm{min-height:40px;padding:4px 14px;font-size:.92rem;border-radius:14px}
.btn .ico{width:26px;height:26px}
.btn.sm .ico{width:22px;height:22px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;filter:grayscale(.4)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:800;background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--depth)}
.chip.live{background:var(--leaf-soft);color:var(--leaf)}
.chip.draft{background:var(--sun-soft)}
.panel{padding:20px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:800;font-size:.85rem;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:9px 14px;border-radius:14px;border:2px solid transparent;background:var(--surface-2);box-shadow:inset 0 3px 6px -2px var(--drop),inset 0 -1px 0 var(--hi)}
textarea.inp{min-height:110px;resize:vertical}
.inp:focus{border-color:var(--sky);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.note{padding:12px 16px;border-radius:16px;background:var(--sky-soft);font-size:.94rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.05)}
.note.warn{background:var(--sun-soft)}
.note.bad{background:var(--coral-soft)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:18px;font-weight:800;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35),0 18px 30px -12px var(--drop)}

/* pictures */
.pic{position:relative;display:grid;place-items:center;aspect-ratio:1;width:100%;max-width:100%;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 80% at 30% 15%,var(--sheen),transparent 55%),var(--tint,var(--t1));
  box-shadow:inset 0 3px 0 var(--sheen),inset 0 -8px 0 rgba(0,0,0,.06)}
.pic img{width:100%;height:100%;object-fit:contain;padding:7%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
.pic .emo{font-size:clamp(2.6rem,10vw,5rem);line-height:1;filter:drop-shadow(0 10px 6px rgba(0,0,0,.28))}
.pic.sm .emo{font-size:2.2rem}
.pic.xs .emo{font-size:1.6rem}

/* growth */
.growth{position:relative;width:120px;height:120px;flex:none;display:grid;place-items:end center}
.growth::after{content:"";position:absolute;left:12%;right:12%;bottom:4%;height:22%;border-radius:50%;background:radial-gradient(closest-side,#a8774a,#7b5230);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 6px 10px -4px var(--drop)}
.growth img{position:relative;z-index:1;width:74%;height:74%;object-fit:contain;margin-bottom:10%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28));animation:bob 3.4s ease-in-out infinite}
.growth.sm{width:58px;height:58px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* hero */
.hero3d{position:relative;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:26px 24px;overflow:hidden;
  background:radial-gradient(400px 220px at 85% 0%,var(--sun-soft),transparent 70%),linear-gradient(160deg,var(--surface),var(--sky-soft))}
.hero3d .hero-txt{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hero-art{position:relative;flex:0 0 230px;height:170px}
.hero-art img{height:auto!important;position:absolute;filter:drop-shadow(0 12px 8px rgba(0,0,0,.25));animation:bob 4s ease-in-out infinite}
.hero-art .f1{width:120px;left:60px;top:20px}
.hero-art .f2{width:70px;left:0;top:80px;animation-delay:-1s}
.hero-art .f3{width:74px;right:0;top:70px;animation-delay:-2s}
.hero-art .f4{width:44px;left:28px;top:8px;animation-delay:-.5s}
.hero-art .f5{width:50px;right:24px;top:0;animation-delay:-2.6s}
@media (max-width:560px){.hero-art{flex-basis:100%;height:130px}.hero-art .f1{width:96px;left:calc(50% - 48px)}.hero-art .f2{left:12%}.hero-art .f3{right:12%}}

/* studio */
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:18px}
.stat .ico{width:38px;height:38px}
.stat b{font-family:var(--f-display);font-size:1.5rem;line-height:1}
.acts{display:flex;flex-direction:column;gap:14px}
.act-row{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:14px;transition:transform .15s}
.act-row:hover{transform:translateY(-2px)}
.act-row .meta{min-width:0}
.act-row .meta h3{overflow-wrap:anywhere}

/* ---- 2 picture match ---- */
function gMatch(api){
  var rounds = chunk(shuffle(api.a.words), 4), r = 0;
  function draw(){
    if (r >= rounds.length) return api.finish();
    api.el.textContent=''; api.setScore(t('round')+' '+(r+1)+' '+t('of')+' '+rounds.length);
    var set = rounds[r], sel = null, left = set.length;

    shuffle(set).forEach(function(w){
      var b = h('button',{class:'tile', draggable:'true', 'data-id':w.id}, w.word);
      b.addEventListener('click', function(){ if (b.classList.contains('done')) return; wordsCol.querySelectorAll('.sel').forEach(function(x){x.classList.remove('sel')}); sel=b; b.classList.add('sel'); speak(w.word); });
      b.addEventListener('dragstart', function(e){ sel=b; e.dataTransfer.setData('text/plain', w.id); });
      wordsCol.append(b);
    });
    var picOrder = shuffle(set), shuffleIdx = picOrder.map(function(w){ return set.indexOf(w); });
    picOrder.forEach(function(w){
      var b = h('button',{class:'tile', 'aria-label':'Picture'}, pic(w,'sm'));
      function tryIt(){
        if (!sel || b.classList.contains('done')) return;
        if (sel.getAttribute('data-id') === w.id) {
          b.classList.add('ok','done'); sel.classList.remove('sel'); sel.classList.add('ok','done'); sel.draggable=false; sel=null; beep('ok'); left--;
          if (!left) setTimeout(function(){ r++; draw(); }, 700);
        } else { api.mistakes++; beep('no'); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); }
      }
      b.addEventListener('click', tryIt);
      b.addEventListener('dragover', function(e){ e.preventDefault(); });
      b.addEventListener('drop', function(e){ e.preventDefault(); tryIt(); });
      picsCol.append(b);
    });
    api.el.append(h('div',{class:'match'}, wordsCol, picsCol));
    api.setHint(function(){
      var wb = Array.prototype.find.call(wordsCol.children, function(b){ return !b.classList.contains('done'); }); if (!wb) return;
      var id = wb.getAttribute('data-id'), idx = set.findIndex(function(x){return x.id===id});
      var pb = picsCol.children[shuffleIdx.indexOf(idx)];
      [wb, pb].forEach(function(el){ if (!el) return; el.classList.remove('glowhint'); void el.offsetWidth; el.classList.add('glowhint'); });

function chunk(a,n){ var o=[]; for (var i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); if (o.length>1 && o[o.length-1].length<2){ var l=o.pop(); o[o.length-1]=o[o.length-1].concat(l); } return o; }

/* ---- generic multiple choice ---- */
function mcRun(api, qs, buildPrompt, optLabel){
  var i = 0;
  function draw(){
    if (i >= qs.length) return api.finish();
    api.el.textContent=''; api.setScore((i+1)+' '+t('of')+' '+qs.length);
    var q = qs[i], answered = false;
    api.el.append(buildPrompt(q));
    var box = h('div',{class:'opts'}), wrongBtns = [];
    api.setHint(function(){
      var left = wrongBtns.filter(function(b){ return !b.disabled; });
      if (left.length <= 1) { speak(q.w.word.charAt(0)); toast((LANG==='vi'?'Từ bắt đầu bằng ':'It starts with ')+'"'+q.w.word.charAt(0).toUpperCase()+'"'); return; }
      var b = left[Math.floor(Math.random()*left.length)]; b.disabled = true; b.classList.add('gone-opt');
    });
    q.opts.forEach(function(o){
      var b = h('button',{class:'opt'+(optLabel==='pic'?' picopt':'')}, optLabel==='pic' ? pic(o,'sm') : o.word);
      if (o.id !== q.w.id) wrongBtns.push(b);
      b.addEventListener('click', function(){
        if (answered) return;
        if (o.id === q.w.id){ answered=true; b.classList.add('ok'); beep('ok'); speak(q.w.word); setTimeout(function(){ i++; draw(); }, 900); }
        else { api.mistakes++; beep('no'); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); }
      });
      box.append(b);
    });
    api.el.append(box);
    if (q.auto) setTimeout(function(){ speak(q.w.word); }, 250);
  }
  draw();
}
function makeQs(words, n, k){
  return sample(words, Math.min(n, words.length)).map(function(w){
    var others = sample(words.filter(function(x){return x.id!==w.id && x.word.toLowerCase()!==w.word.toLowerCase()}), Math.min(k-1, words.length-1));
    return {w:w, opts:shuffle(others.concat([w]))};
  });
}

/* ---- 4 memory ---- */
function gMemory(api){
  var set = sample(api.a.words, Math.min(6, api.a.words.length));
  var cards = shuffle(set.map(function(w){return {w:w, kind:'word'}}).concat(set.map(function(w){return {w:w, kind:'pic'}})));
  var open = [], left = set.length, lock = false;
  api.setScore('0 / '+set.length);
  var grid = h('div',{class:'mem'});
  cards.forEach(function(c){
    var b = h('button',{class:'mcard', 'aria-label':'Hidden card'}, I('sprout'));
    c.b = b;
    b.addEventListener('click', function(){
      if (lock || b.classList.contains('open') || b.classList.contains('gone')) return;
      b.classList.add('open'); b.textContent=''; b.append(c.kind==='word' ? c.w.word : pic(c.w,'xs'));
      if (c.kind==='word') speak(c.w.word);

        var x = open[0], y = open[1];
        if (x.w.id === y.w.id) { setTimeout(function(){ x.b.classList.add('gone'); y.b.classList.add('gone'); beep('ok'); open=[]; lock=false; left--; api.setScore((set.length-left)+' / '+set.length); if (!left) setTimeout(api.finish, 600); }, 400); }
        else { api.mistakes++; setTimeout(function(){ [x,y].forEach(function(z){ z.b.classList.remove('open'); z.b.textContent=''; z.b.append(I('sprout')); }); open=[]; lock=false; }, 1000); }
      }
    });

  });

  api.setHint(function(){
    if (lock || open.length) return;
    var rest = cards.filter(function(c){ return !c.b.classList.contains('gone'); }); if (!rest.length) return;

    pair.forEach(function(c){ c.b.classList.add('open','glowhint'); c.b.textContent=''; c.b.append(c.kind==='word' ? c.w.word : pic(c.w,'xs')); });

/* ---- 6 spell it ---- */
function gSpell(api){
  var pool = api.a.words.filter(function(w){var l=lettersOnly(w.word).length; return l>=2 && l<=12});
  var list = sample(pool, Math.min(6, pool.length)), i = 0;
  function draw(){
    if (i >= list.length) return api.finish();
    api.el.textContent=''; api.setScore((i+1)+' '+t('of')+' '+list.length);
    var w = list[i], target = w.word.toUpperCase(), letters = lettersOnly(w.word).split('');
    var placed = []; // indices into tiles
    var tiles = shuffle(letters.map(function(ch, k){return {ch:ch, k:k}}));
    if (tiles.map(function(x){return x.ch}).join('') === letters.join('') && letters.length > 2) tiles.reverse();
    var slots = h('div',{class:'slots'}), bank = h('div',{class:'letters'});
    function refresh(){
      slots.textContent=''; var p = 0;
      target.split('').forEach(function(ch){
        if (!/[A-Z]/.test(ch)) { slots.append(h('div',{class:'slot gap'})); return; }
        var ti = placed[p], my = p; p++;
        slots.append(h('button',{class:'slot'+(ti!=null?' filled':''), 'aria-label':'Letter slot', onclick:function(){ if (ti!=null){ placed.splice(my,1); refresh(); } }}, ti!=null ? tiles[ti].ch : ''));
      });
      bank.textContent='';
      tiles.forEach(function(tl, idx){
        bank.append(h('button',{class:'letter'+(placed.indexOf(idx)>=0?' used':''), onclick:function(){ if (placed.length<letters.length){ placed.push(idx); refresh(); check(); } }}, tl.ch));
      });
    }
    function check(){
      if (placed.length < letters.length) return;
      var got = placed.map(function(x){return tiles[x].ch}).join('');
      if (got === letters.join('')) { beep('ok'); speak(w.word); slots.querySelectorAll('.slot').forEach(function(s){s.classList.add('ok')}); setTimeout(function(){ i++; draw(); }, 1000); }
      else { api.mistakes++; beep('no'); slots.classList.remove('no'); void slots.offsetWidth; slots.classList.add('no'); setTimeout(function(){ placed=[]; refresh(); }, 700); }
    }
    api.el.append(h('div',{class:'qcard'}, pic(w), h('p',{class:'qtext'}, w.meaning),
      h('div',{class:'row', style:'justify-content:center'}, sayBtn(w.word, true), h('button',{class:'btn sm', onclick:function(){placed=[]; refresh();}}, t('clear')))));
    api.el.append(slots, bank); refresh();
    api.setHint(function(){
      var k = 0; while (k < placed.length && tiles[placed[k]].ch === letters[k]) k++;
      placed = placed.slice(0, k);
      if (k >= letters.length) return;
      var need = letters[k], idx = tiles.findIndex(function(tl, j){ return tl.ch === need && placed.indexOf(j) < 0; });
      if (idx >= 0) { placed.push(idx); refresh(); check(); }
    });
  }
  draw();
}

/* ---- 7 fill the gap ---- */
function gapWords(a){
  return (a.words||[]).filter(function(w){ return w.example && new RegExp('\\b'+w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(w.example); });
}
function gGap(api){
  var pool = gapWords(api.a);
  var qs = sample(pool, Math.min(8, pool.length)).map(function(w){
    var others = sample(api.a.words.filter(function(x){return x.id!==w.id}), Math.min(3, api.a.words.length-1));
    return {w:w, opts:shuffle(others.concat([w]))};
  });
  mcRun(api, qs, function(q){
    var re = new RegExp('\\b'+q.w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    var parts = q.w.example.split(re);

/* ---- 8 word search ---- */
function gSearch(api){
  var pool = api.a.words.filter(function(w){var l=lettersOnly(w.word).length; return l>=2 && l<=10});
  var chosen = sample(pool, Math.min(8, pool.length));
  var N = Math.max(8, Math.min(12, Math.max.apply(null, chosen.map(function(w){return lettersOnly(w.word).length})) + 2));
  var grid = [], placed = [];
  for (var y=0;y<N;y++){ grid.push([]); for (var x=0;x<N;x++) grid[y].push(''); }
  var dirs = [[1,0],[0,1],[1,1]];
  chosen.forEach(function(w){
    var s = lettersOnly(w.word);
    for (var tries=0; tries<200; tries++){
      var d = dirs[Math.floor(Math.random()*dirs.length)];
      var x0 = Math.floor(Math.random()*(N - d[0]*(s.length-1))), y0 = Math.floor(Math.random()*(N - d[1]*(s.length-1)));
      var ok = true;
      for (var k=0;k<s.length;k++){ var c=grid[y0+d[1]*k][x0+d[0]*k]; if (c && c!==s[k]) { ok=false; break; } }
      if (!ok) continue;
      for (k=0;k<s.length;k++) grid[y0+d[1]*k][x0+d[0]*k]=s[k];
      placed.push({w:w, s:s, x0:x0, y0:y0, x1:x0+d[0]*(s.length-1), y1:y0+d[1]*(s.length-1), got:false});
      break;
    }
  });
  var AL='ABCDEFGHIKLMNOPRSTUW';
  for (y=0;y<N;y++) for (x=0;x<N;x++) if (!grid[y][x]) grid[y][x]=AL[Math.floor(Math.random()*AL.length)];
  var start = null, cells = [];
  var box = h('div',{class:'ws', style:'grid-template-columns:repeat('+N+',1fr)'});
  var list = h('div',{class:'wslist'});
  function drawList(){ list.textContent=''; placed.forEach(function(p){ list.append(h('span',{class:p.got?'got':''}, p.w.word)); }); api.setScore(placed.filter(function(p){return p.got}).length+' / '+placed.length); }
  for (y=0;y<N;y++) for (x=0;x<N;x++) (function(x,y){
    var b = h('button',{'aria-label':grid[y][x]}, grid[y][x]); cells.push(b);
    b.addEventListener('click', function(){
      if (!start) { start={x:x,y:y,b:b}; b.classList.add('start'); return; }
      start.b.classList.remove('start');
      var hit = placed.find(function(p){ return !p.got && ((p.x0===start.x&&p.y0===start.y&&p.x1===x&&p.y1===y)||(p.x1===start.x&&p.y1===start.y&&p.x0===x&&p.y0===y)); });
      if (hit) {
        hit.got = true; beep('ok'); speak(hit.w.word);
        var dx=Math.sign(hit.x1-hit.x0), dy=Math.sign(hit.y1-hit.y0);
        for (var k=0;k<hit.s.length;k++) cells[(hit.y0+dy*k)*N + hit.x0+dx*k].classList.add('found');
        drawList();
        if (placed.every(function(p){return p.got})) setTimeout(api.finish, 700);
      } else if (!(start.x===x && start.y===y)) { api.mistakes++; beep('no'); }
      start = null;
    });
    box.append(b);
  })(x,y);
  api.el.append(h('p',{class:'note small'}, LANG==='vi' ? 'Chạm vào chữ cái đầu tiên, rồi chạm vào chữ cái cuối cùng của từ.' : 'Tap the first letter of a word, then tap its last letter.'));
  api.el.append(h('div',{class:'ws-board'}, box), list); drawList();
  api.setHint(function(){
    var p = placed.find(function(x){ return !x.got; }); if (!p) return;
    var c = cells[p.y0*N + p.x0]; c.classList.remove('glowhint'); void c.offsetWidth; c.classList.add('glowhint');
    speak(p.w.word); toast((LANG==='vi'?'Tìm từ ':'Look for ')+'"'+p.w.word+'"');
  });
  var orig = api.finish; api.finish = function(){ api.mistakes = Math.max(0, api.mistakes-2); orig(); };
}

/* ---- 9 sort it ---- */
function gSort(api){
  var cats = api.a.categories, pool = shuffle(api.a.words.filter(function(w){return w.category && cats.indexOf(w.category)>=0})), i=0;
  function draw(){
    if (i >= pool.length) return api.finish();
    api.el.textContent=''; api.setScore((i+1)+' '+t('of')+' '+pool.length);
    var w = pool[i];
    api.el.append(h('div',{class:'qcard'}, pic(w,'sm'), h('div',{class:'fc-word', style:'font-size:2rem'}, w.word), sayBtn(w.word, true), h('div',{class:'eyebrow'}, t('sortq'))));
    var bins = h('div',{class:'bins'});
    cats.forEach(function(c){
      var b = h('button',{class:'bin'}, c);
      b.addEventListener('click', function(){
        if (c === w.category) { b.classList.add('ok'); beep('ok'); setTimeout(function(){ i++; draw(); }, 600); }
        else { api.mistakes++; beep('no'); b.classList.add('no'); setTimeout(function(){ b.classList.remove('no'); }, 500); }
      });
      bins.append(b);
    });
    api.el.append(bins);
    api.setHint(function(){
      var wrong = Array.prototype.filter.call(bins.children, function(b){ return b.textContent !== w.category && !b.disabled; });
      if (wrong.length >= 2 || (wrong.length === 1 && cats.length > 2)) { var b = wrong[0]; b.disabled = true; b.classList.add('gone-opt'); }
      else toast(w.meaning, 4000);
    });
  }
  draw();
}

/* ---- 10 super challenge ---- */
function normWord(s){ return String(s||'').toLowerCase().replace(/[^a-z]/g,''); }
function editDist(a, b){
  var d = []; for (var i=0;i<=a.length;i++){ d[i]=[i]; } for (var j=0;j<=b.length;j++) d[0][j]=j;
  for (i=1;i<=a.length;i++) for (j=1;j<=b.length;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function gChallenge(api){
  api.setHint(null);
  var a = api.a, TOTAL = 90, left = TOTAL, score = 0, streak = 0, right = 0, asked = 0, answered = 0, done = false;
  var words = a.words.filter(function(w){ return normWord(w.word).length >= 2; });
  var deck = [], timer = null;
  function nextWord(){ if (!deck.length) deck = shuffle(words); return deck.pop(); }
  var timeBar = h('i'), timeTxt = h('b',null,TOTAL+'s'), scoreTxt = h('b',null,'0'), streakTxt = h('span',{class:'chip'}, '');
  var hud = h('div',{class:'hud clay'},
    h('div',{class:'row', style:'gap:6px'}, I('glow'), scoreTxt, h('span',{class:'small muted'}, t('points'))),
    streakTxt,
    h('div',{class:'row', style:'gap:6px'}, h('span',{class:'small muted'}, t('time')), timeTxt));
  var meter = h('div',{class:'meter timer'}, timeBar);
  var qbox = h('div',{class:'stack'});
  function intro(){
    api.el.textContent='';
    var best = +(lsGet('fs:best:'+a.code)||0);
    api.el.append(h('div',{class:'done-box clay', style:'padding:26px'},
      I('trophy','medal'),
      h('h2',{class:'t3d'}, LANG==='vi'?'Thử thách siêu cấp':'Super Challenge'),
      h('p',{class:'qtext', style:'max-width:40ch'}, LANG==='vi' ? 'Em có 90 giây. Đọc nghĩa, nghe hoặc xem tranh rồi GÕ đúng từ. Trả lời đúng liên tiếp để được thêm điểm!' : 'You have 90 seconds. Read the meaning, listen, or look at the picture, then TYPE the word. Get answers right in a row for bonus points!'),
      best ? h('p',{class:'muted'}, t('best')+': '+best+' '+t('points')) : null,
      h('button',{class:'btn sun', onclick:start}, I('rocket'), t('go2'))));
  }
  function start(){
    api.el.textContent=''; api.el.append(hud, meter, qbox);
    left = TOTAL; score = 0; streak = 0; right = 0; asked = 0; answered = 0; done = false;
    tick(); timer = setInterval(function(){ if (!api.el.isConnected) { clearInterval(timer); return; } left--; tick(); if (left <= 0) end(); }, 1000);
    ask();
  }
  function tick(){ timeTxt.textContent = Math.max(0,left)+'s'; timeBar.style.width = Math.max(0,left/TOTAL*100)+'%'; timeBar.classList.toggle('low', left <= 15); scoreTxt.textContent = score; streakTxt.textContent = streak >= 2 ? '🔥 '+streak+' '+t('streak') : ''; streakTxt.hidden = streak < 2; }
  function ask(){
    if (done) return;
    var w = nextWord(); asked++;
    var types = ['mean','pic','hear']; var type = types[Math.floor(Math.random()*types.length)];
    if (type==='mean' && !w.meaning) type = 'pic';
    qbox.textContent = '';
    var input = h('input',{class:'inp big-inp', id:'ch-in', autocomplete:'off', autocapitalize:'off', spellcheck:'false', 'aria-label':'Type the word', placeholder:'…'});
    var msg = h('div',{class:'small', 'aria-live':'polite', style:'min-height:1.4em;font-weight:800'});
    var prompt = type==='mean' ? h('div',{class:'qcard'}, h('div',{class:'eyebrow'}, t('typeMean')), h('p',{class:'qtext'}, w.meaning))
      : type==='pic' ? h('div',{class:'qcard'}, h('div',{class:'eyebrow'}, t('typePic')), pic(w))
      : h('div',{class:'qcard'}, h('div',{class:'eyebrow'}, t('typeHear')), h('div',{class:'row', style:'justify-content:center'}, sayBtn(w.word), h('button',{class:'btn sm', 'aria-label':'Say it slowly', onclick:function(){ var o=slowTalk; slowTalk=true; speak(w.word); slowTalk=o; }}, I('turtle'))));
    var tries = 0;
    function submit(e){
      if (e) e.preventDefault(); if (done) return;
      var got = normWord(input.value), want = normWord(w.word);
      if (!got) return;
      if (got === want) {
        streak++; right++; answered++; score += 10 + Math.min(streak-1, 5)*2; ting(); tick();
        input.classList.add('right'); msg.textContent = '✓ '+w.word;
        setTimeout(ask, 650);
      } else if (tries === 0 && editDist(got, want) <= Math.max(1, Math.floor(want.length/6))) {
        tries++; msg.textContent = t('close'); input.select();
      } else {
        streak = 0; answered++; tick(); beep('no'); input.classList.add('wrong');
        msg.textContent = t('answerWas')+': '+w.word; speak(w.word);
        setTimeout(ask, 1500);
      }
    }
    qbox.append(prompt, h('form',{class:'copyline', onsubmit:submit}, input, h('button',{class:'btn primary', type:'submit'}, I('check'), t('check')),
      h('button',{class:'btn ghost sm', type:'button', onclick:function(){ if (done) return; streak = 0; answered++; tick(); msg.textContent = t('answerWas')+': '+w.word; setTimeout(ask, 1200); }}, t('skip'))), msg);
    if (type==='hear') setTimeout(function(){ speak(w.word); }, 200);
    setTimeout(function(){ try { input.focus(); } catch(e){} }, 50);
  }
  function end(){
    if (done) return; done = true; clearInterval(timer);
    var best = +(lsGet('fs:best:'+a.code)||0), isBest = score > best;
    if (isBest) lsSet('fs:best:'+a.code, String(score));
    var st = right >= words.length ? 3 : right >= Math.ceil(words.length/2) ? 2 : right >= 1 ? 1 : 0;
    if (st) saveProg(a.code, 'challenge', st);
    api.el.textContent=''; beep('win'); if (right) confetti();
    api.el.append(h('div',{class:'done-box'},
      I('trophy','medal'),
      h('h2',{class:'t3d'}, t('timesup')),
      h('div',{class:'bigscore'}, score, h('small',null,' '+t('points'))),
      isBest && score ? h('span',{class:'chip live'}, t('newbest')) : h('p',{class:'muted'}, t('best')+': '+Math.max(best,score)),
      h('p',{class:'muted'}, right+' / '+answered+' '+t('correct')),
      st ? starRow(st,'big-stars') : null,
      h('div',{class:'row', style:'justify-content:center'},
        h('button',{class:'btn sun', onclick:start}, I('rocket'), t('playagain')),
        h('button',{class:'btn ghost', onclick:function(){go({name:'hub', id:a.id})}}, t('menu')))));
  }
  intro();
}

function friendlyErr(e){
  var c = e && e.code;
  if (c==='not_granted') return 'You said no to the AI helper. Reload the page and allow it to use this feature.';
  if (c==='rate_limited') return 'The AI helper is busy. Wait a minute and try again.';
  if (c==='prompt_too_large') return 'This lesson file is too long. Upload just the slides for this lesson, or paste the main text.';
  if (c==='images_unavailable' || c==='image_rejected') return 'The AI could not read the pictures in this file. Try a PDF with real text, or paste the text.';
  if (c==='invalid_json' || c==='empty_completion') return 'The AI answer came back incomplete. Click the button again.';
  return (e && e.message) ? e.message : 'Something went wrong. Please try again.';
}

/* ---- file reading ---- */
async function readLessonFile(file){
  var name = file.name.toLowerCase(), out = {text:'', images:[], gallery:[]};
  if (/\.(ppt|doc|key|pages)$/.test(name)) throw new Error('Please save this file as .pptx, .docx or PDF first (File → Save As), then upload it again.');
  if (/\.(txt|md)$/.test(name)) { out.text = await file.text(); return out; }
  if (/\.(png|jpe?g|webp)$/.test(name) || /^image\//.test(file.type)) {
    out.images = [await toJpegBlob(file, 1600)]; out.gallery = [await compressImage(file, 480)]; return out;
  }
  if (/\.pdf$/.test(name)) return readPdf(file);
  if (/\.(pptx|docx)$/.test(name)) {
    await loadScript(LIBS.zip);
    var zip = await window.JSZip.loadAsync(file);
    var isPpt = /\.pptx$/.test(name);
    var paths = Object.keys(zip.files);
    var textFiles = paths.filter(function(p){ return isPpt ? /^ppt\/(slides|notesSlides)\/[a-zA-Z]+\d+\.xml$/.test(p) : /^word\/document\.xml$/.test(p); })
      .sort(function(a,b){ return (a.indexOf('notes')>=0) - (b.indexOf('notes')>=0) || (+a.replace(/\D/g,'')) - (+b.replace(/\D/g,'')); });
    var parts = [];
    for (var i=0;i<textFiles.length;i++){
      var xml = await zip.file(textFiles[i]).async('string');
      var tag = isPpt ? 'a:t' : 'w:t';
      var paraTag = isPpt ? '</a:p>' : '</w:p>';
      var txt = xml.split(paraTag).map(function(p){ var m = p.match(new RegExp('<'+tag+'[^>]*>([^<]*)</'+tag+'>','g')) || []; return m.map(function(s){return s.replace(/<[^>]+>/g,'')}).join(''); }).filter(Boolean).join('\n');
      txt = txt.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
      if (txt.trim()) parts.push((isPpt ? (textFiles[i].indexOf('notes')>=0?'[Notes] ':'[Slide '+textFiles[i].replace(/\D/g,'')+'] ') : '') + txt);
    }
    out.text = parts.join('\n\n');
    var media = paths.filter(function(p){ return /^(ppt|word)\/media\/.+\.(png|jpe?g|gif|webp)$/i.test(p); }).slice(0, 40);
    for (i=0;i<media.length;i++){
      try { var b = await zip.file(media[i]).async('blob'); if (b.size < 2500) continue; var ext = media[i].split('.').pop().toLowerCase(); b = new Blob([b], {type:'image/'+(ext==='jpg'?'jpeg':ext)}); out.gallery.push(await compressImage(b, 480)); } catch(e){}
    }
    return out;
  }
  throw new Error('FLIPSEED can read PDF, PowerPoint (.pptx), Word (.docx), text files and photos.');
}
async function readPdf(file){
  await loadScript(LIBS.pdf);
  var pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  var doc = await pdfjs.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  var out = {text:'', images:[], gallery:[]}, parts = [];
  var n = Math.min(doc.numPages, 60);
  for (var p=1;p<=n;p++){
    var page = await doc.getPage(p), tc = await page.getTextContent();
    var s = tc.items.map(function(i){return i.str}).join(' ').replace(/\s+/g,' ').trim();
    if (s) parts.push('[Page '+p+'] '+s);
  }
  out.text = parts.join('\n');
  var maxImgs = 5;
  try { var lim = await CAP.sample.limits(); if (lim && lim.images) maxImgs = Math.min(maxImgs, lim.images.maxCount); else maxImgs = 0; } catch(e){}
  var needImgs = out.text.length < 300 * Math.min(n, 3);
  var pages = needImgs ? Math.min(doc.numPages, maxImgs) : 0;
  for (p=1;p<=pages;p++){
    var pg = await doc.getPage(p), vp = pg.getViewport({scale:1}); var sc = 1400/Math.max(vp.width, vp.height);
    var v2 = pg.getViewport({scale:sc}), c = document.createElement('canvas'); c.width = v2.width; c.height = v2.height;
    await pg.render({canvasContext:c.getContext('2d'), viewport:v2}).promise;
    var blob = await new Promise(function(r){ c.toBlob(r, 'image/jpeg', 0.82); });
    if (blob) out.images.push(blob);
  }
  return out;
}
function toJpegBlob(file, max){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ var sc=Math.min(1,max/Math.max(im.width,im.height)); var c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(res,'image/jpeg',0.85); };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('That picture could not be opened.')); };
    im.src = url;
  });
}

/* ---- AI ---- */
async function extractVocab(content, grade, topic, count, vi){
  var text = content.text.slice(0, 60000);
  var level = +grade <= 2 ? 'A1 (very young learners: 5–8 very easy words per meaning)' : +grade <= 5 ? 'A1–A2' : 'A2–B1';
  var prompt = [
    'You help a Science teacher at a bilingual school in Hanoi, Vietnam. Students are Vietnamese children learning Science in English.',
    'Task: from the lesson below, choose the '+count+' most important Science vocabulary words or short phrases that students must know BEFORE the lesson starts (flipped classroom). Grade '+grade+'. English level for definitions: '+level+'.',
    topic ? 'The teacher says the topic is: '+topic+'.' : '',
    'Rules:',
    '- Pick words that carry the Science ideas of THIS lesson, not general words like "look" or "page".',
    '- Use the Science meaning of each word.',
    '- "meaning": one short, simple sentence (max 12 words) using only words easier than the word itself. Do not use the word itself in its meaning.',
    '- "example": one short sentence (max 12 words) about the lesson that contains the exact word.',
    '- "vi": '+(vi ? 'the Vietnamese translation of the word as Vietnamese primary Science textbooks would say it.' : 'empty string.'),
    '- "emoji": one emoji that best shows the word to a child (a picture placeholder).',
    '- "categories": if the words naturally split into 2–3 groups taught in the lesson (e.g. "Living", "Non-living"), list the group names; otherwise an empty list. "category": the group name for each word, or "".',
    '- "check": true only if the lesson does not make the meaning clear and the teacher should check it.',
    '- "title": a short, child-friendly activity title (max 6 words).',
    'Never invent facts that are not true. Return ONLY JSON in this shape:',
    '{"title":"","categories":[],"words":[{"word":"","meaning":"","example":"","vi":"","emoji":"","category":"","check":false}]}',
    '',
    'LESSON CONTENT:',
    text || '(The lesson is in the attached pictures. Read them.)'
  ].join('\n');
  var opts = {modelTier:'default'};
  if (content.images && content.images.length) opts.images = content.images;
  return CAP.sample.json(prompt, opts);
}
async function aiFillWord(w, grade, vi, lessonTitle){
  var prompt = 'You help a Science teacher in Vietnam make vocabulary flashcards for Grade '+grade+' English learners (CEFR '+(+grade<=5?'A1–A2':'A2–B1')+'). Lesson: "'+lessonTitle+'". Word: "'+w.word+'".\n' +
    'Return ONLY JSON: {"meaning":"one simple sentence, max 12 words, Science meaning, without using the word","example":"short lesson sentence containing the exact word","vi":"'+(vi?'Vietnamese translation of the word':'')+'","emoji":"one emoji that shows the word"}';
  return CAP.sample.json(prompt, {modelTier:'quick'});
}
async function aiDraw(w){
  var prompt = 'Draw a simple, friendly, colourful flat illustration for young children that clearly shows: "'+w.word+'" ('+(w.meaning||'a Science word')+').\n' +
    'Rules: one SVG, viewBox="0 0 240 240", a soft pastel circle or rounded square as background, bold simple shapes with dark outlines (stroke-width 3), bright cheerful colours, scientifically correct, NO text, letters or numbers, no <script>, no <image>, no <style>, no filters, no gradients, under 40 shapes.\n' +
    'Return ONLY JSON: {"svg":"<svg ...>...</svg>"}';
  var r = await CAP.sample.json(prompt, {modelTier:'default'});
  var d = sanitizeSvg(r && r.svg);
  if (!d) throw new Error('The drawing came back broken. Try again.');
  return d;
}

        h('label',{class:'btn sm', for:'pf-'+x.id}, I('picture'), 'Upload a picture'), file,
        CAP.sample ? h('button',{class:'btn sm', onclick:async function(){ var b=this; b.disabled=true; msg.textContent=''; msg.append(h('div',{class:'progress small'}, h('div',{class:'spin'}), 'Drawing '+x.word+'…')); try { x.img = await aiDraw(x); touch(); openPicker=null; renderWords(); } catch(e){ msg.textContent=''; msg.append(h('p',{class:'note bad small'}, friendlyErr(e))); b.disabled=false; } }}, I('palette'), 'AI draw it') : null,
        x.img ? h('button',{class:'btn sm', onclick:function(){ editPic(x); }}, I('scissors'), 'Crop and rotate') : null,
        x.img ? h('button',{class:'btn ghost sm', onclick:function(){ x.img=''; touch(); renderWords(); }}, 'Use the emoji instead') : null),
      h('div',{class:'row'}, h('span',{class:'small', style:'font-weight:800'}, 'Emoji'), emo, h('button',{class:'btn sm', onclick:function(){ x.emoji = emo.value.trim(); x.img=''; touch(); renderWords(); }}, 'Use emoji')),
      h('div',{class:'stack', style:'gap:6px'},
        h('span',{class:'small', style:'font-weight:800'}, 'Search the web'),
        h('div',{class:'row'},
          h('a',{class:'btn sm', href:'https://openverse.org/search/image?q='+encodeURIComponent(x.word||''), target:'_blank', rel:'noopener'}, 'Openverse (free to use)'),
          h('a',{class:'btn sm', href:'https://www.google.com/search?tbm=isch&safe=active&q='+q, target:'_blank', rel:'noopener'}, 'Google Images (SafeSearch)'),
          h('a',{class:'btn sm', href:'https://commons.wikimedia.org/w/index.php?search='+encodeURIComponent(x.word||'')+'&title=Special:MediaSearch&type=image', target:'_blank', rel:'noopener'}, 'Wikimedia')),
        h('span',{class:'small muted'}, 'Found one? Right-click it → Copy image. Come back, click this word\'s picture, and press Ctrl+V. Or save it and drop the file on the picture.')),
      gallery.length ? h('div',{class:'stack', style:'gap:6px'},
        h('span',{class:'small', style:'font-weight:800'}, 'Pictures from your lesson file'),
        h('div',{class:'gallery'}, gallery.map(function(src){ return h('button',{'aria-label':'Use this picture', onclick:function(){ x.img = src; touch(); openPicker=null; renderWords(); editPic(x, true); }}, h('img',{src:src, alt:''})); }))) : null,
      msg);
  }
  async function setImg(x, f){
    try { x.img = await compressImage(f, 1000); activePic = x.id; touch(); openPicker=null; renderWords(); editPic(x, true); }
    catch(e){ toast(e.message || 'That picture could not be used.'); }
  }
  function editPic(x, fresh){
    if (!x.img) return;
    var before = x.img;
    openCropper(x.img, x.word, function(d){ x.img = d; touch(); renderWords(); toast('Picture saved'); }, {fresh:fresh});
    if (fresh) setTimeout(function(){ if (x.img === before && before.length > 40000) { /* shrink an uncropped large upload */ compressImage(dataUrlToBlob(before), 480).then(function(d){ if (x.img === before) { x.img = d; touch(); } }); } }, 0);
  }
  async function fillWord(x, btn){
    if (!x.word.trim()) return toast('Type the word first.');
    btn.disabled = true; btn.textContent = 'Thinking…';
    try { var r = await aiFillWord(x, act.grade, act.showVi, act.title); x.meaning=r.meaning||x.meaning; x.example=r.example||x.example; if (act.showVi) x.vi=r.vi||x.vi; if (!x.img && r.emoji) x.emoji=r.emoji; touch(); renderWords(); }
    catch(e){ toast(friendlyErr(e)); btn.disabled=false; btn.textContent=''; btn.append(I('sparkles'), 'AI fill meaning'); }
  }
  async function drawAll(){
    var todo = act.words.filter(function(x){return !x.img && x.word});
    if (!todo.length) return toast('Every word already has a picture.');
    var btn = head.querySelector('button'), lbl = btn.querySelector('span'); btn.disabled = true; var done = 0, failed = 0;
    async function worker(){ while (todo.length){ var x = todo.shift(); try { x.img = await aiDraw(x); } catch(e){ failed++; } done++; lbl.textContent = 'Drawing '+done+'…'; touch(); renderWords(); } }
    await Promise.all([worker(), worker(), worker()]);
    btn.disabled = false; lbl.textContent = 'Draw all missing pictures';
    toast(failed ? failed+' picture'+(failed>1?'s':'')+' could not be drawn. Try those again one by one.' : 'All pictures drawn. Check them and swap any you don\'t like.', 4000);
  }
  document.onpaste = function(e){
    if (view.name !== 'edit' || !activePic) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i=0;i<items.length;i++) if (items[i].type.indexOf('image/')===0) {
      var x = act.words.find(function(z){return z.id===activePic}); if (!x) return;
      e.preventDefault(); setImg(x, items[i].getAsFile()); return;
    }
  };
  renderWords();

  // action bar
  var err = h('span',{class:'small', 'aria-live':'polite'});
  function commit(status){
    var clean = act.words.filter(function(x){return x.word.trim()});
    if (clean.length < 2) { err.textContent = 'Add at least 2 words before saving.'; return; }
    act.words = clean.map(function(x){ x.word = x.word.trim(); return x; });
    act.status = status; act.updated = Date.now();
    var i = DATA.activities.findIndex(function(a){return a.id===act.id});
    if (i >= 0) DATA.activities[i] = act; else DATA.activities.push(act);
    savePage(status==='published' ? {name:'share', id:act.id} : {name:'studio'}, status==='published' ? 'Published for students' : 'Saved as draft', function(){ lsDel('fs:wip:'+act.id); });
  }
  w.append(h('div',{class:'bar'}, err,
    h('button',{class:'btn ghost', onclick:function(){ go({name:'studio'}); }}, 'Back'),
    h('button',{class:'btn', onclick:function(){ var copyAct = JSON.parse(JSON.stringify(act)); go({name:'hub', id:act.id}); PREVIEW = copyAct; render(); }}, I('eyes'), 'Preview'),
    h('button',{class:'btn', onclick:function(){ commit('draft'); }}, I('save'), act.status==='published' ? 'Save and hide from students' : 'Save draft'),
    h('button',{class:'btn primary', onclick:function(){ commit('published'); }}, I('rocket'), act.status==='published' ? 'Save changes' : 'Publish for students')));
}

/* ---- share ---- */
function tShare(w){
  var a = findAct(view.id); if (!a) return go({name:'studio'});
  w.append(topBar(false));
  var link = studentLink(a);
  w.append(h('div',{class:'stack', style:'gap:4px;margin-bottom:16px'}, h('div',{class:'eyebrow'}, a.status==='published'?'Live for students':'Draft, students cannot see it yet'), h('h1',{class:'t3d'},a.title)));
  var left = h('div',{class:'stack'});
  var qrBox = h('div',{class:'qr'});
  left.append(h('div',{class:'eyebrow'},'Activity code'), h('div',{class:'code'}, a.code.toUpperCase()),
    h('p',{class:'small muted'},'Students can type this code on the FLIPSEED home page.'));
  if (a.status === 'published') {
    left.append(h('div',{class:'field'}, h('label',{for:'sh-link'},'Student link for this activity'), linkStrip(a, 'sh-link')));
    left.append(h('p',{class:'small muted'},'Send it in your class Zalo group or show the QR code in class. Students open it on any phone or computer. No login, no account.'));
    if (isAutoSite() && siteStale()) left.append(h('p',{class:'note small'}, 'Your website picks up new and changed activities automatically within the hour.'));
    else if (isSiteLink() && siteStale()) left.append(h('div',{class:'note warn small stack', style:'gap:8px'}, 'Upload the newest website file first, or this link will not open the activity yet.', h('button',{class:'btn sm', style:'align-self:flex-start', onclick:exportSite}, I('inbox'), 'Download website file')));
    else if (!isSiteLink()) left.append(h('p',{class:'note small'}, 'Tip: set up your free student website in the Studio (bottom of the page) so this link opens without the Claude page.'));
  } else {
    left.append(h('p',{class:'note warn'},'This activity is a draft. Publish it and its student link and QR code appear here.'));
    link = '';
  }
  if (a.status !== 'published') left.append(h('button',{class:'btn primary', style:'align-self:flex-start', onclick:function(){ a.status='published'; a.updated=Date.now(); savePage({name:'share', id:a.id}, 'Published for students'); }}, I('rocket'), 'Publish for students'));
  left.append(h('div',{class:'row'}, h('button',{class:'btn', onclick:function(){ go({name:'hub', id:a.id}); }}, I('eyes'), 'Preview as a student'), h('button',{class:'btn ghost', onclick:function(){ go({name:'studio'}); }}, '← All activities')));
  w.append(h('div',{class:'panel', style:'display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start'}, h('div',{style:'flex:1;min-width:240px'}, left), link ? qrBox : null));
  if (link) loadScript(LIBS.qr).then(function(){ try { new window.QRCode(qrBox, {text:link, width:200, height:200, correctLevel:window.QRCode.CorrectLevel.M}); } catch(e){ qrBox.remove(); } }).catch(function(){ qrBox.remove(); });
}
function copy(text, inp, ok){
  try { navigator.clipboard.writeText(text).then(function(){ toast(ok || 'Copied'); }, function(){ inp.select(); toast('Press Ctrl+C to copy'); }); }
  catch(e){ inp.select(); toast('Press Ctrl+C to copy'); }
}

/* ---- saving: the page republishes itself ---- */
function buildHtml(data){
  var json = JSON.stringify(data || DATA).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return SKELETON + HEAD_SRC +
    '<style id="fs-style">' + SRC_STYLE + '</style>\n<div id="app"></div>\n' +
    '<script id="fs-data" type="application/json">' + json + '<\/script>\n' +
    '<script id="fs-icons" type="application/json">' + SRC_ICONS + '<\/script>\n' +
    '<script id="fs-app">' + SRC_APP + '<\/script>\n</body></html>';
}
var saving = false;
async function savePage(nextView, okMsg, onOk){
  if (saving) return; saving = true;
  if (!CAP.artifact) { saving=false; toast('Saving works only when you open FLIPSEED in Claude as its owner.', 4000); return; }
  var html = buildHtml();
  if (html.length > MAX_BYTES - 200000) { saving=false; toast('FLIPSEED is full. Delete an old activity or use fewer uploaded photos, then save again.', 5000); return; }
  ssSet('fs:return', JSON.stringify({view:nextView, msg:okMsg}));
  showSaving();
  if (onOk) onOk();
  try {
    await CAP.artifact.publish(html);
  } catch(e) {
    hideSaving(); saving = false; ssDel('fs:return');
    var c = e && e.code;
    if (c === 'conflict') { toast('FLIPSEED was changed somewhere else. Reloading the newest version…', 4000); return; }
    if (c === 'not_writer' || c === 'not_granted' || c === 'capability_disabled') { toast('This copy of FLIPSEED is read-only for you, so changes cannot be saved here.', 5000); return; }
    if (c === 'too_large') { toast('FLIPSEED is full. Delete an old activity, then save again.', 5000); return; }
    if (c === 'rate_limited') { toast('Saving too often. Wait a moment and try again.', 4000); return; }
    toast('Saving failed. Your edits are kept on this computer; try again in a moment.', 5000);
  }
}
var savingEl = null;
function showSaving(){ savingEl = h('div',{class:'toast', role:'status'}, h('span',{class:'progress'}, h('span',{class:'spin'}), 'Saving FLIPSEED…')); document.body.append(savingEl); }
function hideSaving(){ if (savingEl) savingEl.remove(); savingEl=null; }


/* ---------- fun animated background ---------- */

  var bg = h('div',{class:'bgfx', 'aria-hidden':'true'});
  bg.append(h('div',{class:'dots'}), h('div',{class:'rays'}), h('div',{class:'sun'}));
  for (var i=0;i<26;i++) bg.append(h('span',{class:'star', style:'left:'+(Math.random()*100)+'%;top:'+(Math.random()*55)+'%;animation-delay:'+(-Math.random()*3)+'s'}));
  [[8,70,-10],[24,95,-48],[42,80,-24],[16,120,-70]].forEach(function(c){ bg.append(h('div',{class:'cloud', style:'top:'+c[0]+'%;animation-duration:'+c[1]+'s;animation-delay:'+c[2]+'s'})); });
  var doodles = [['test',4,22,58],['dna',90,38,52],['sprout',6,62,60],['microscope',92,70,64],['star',14,10,40],['raindrop',84,20,40],['sparkles',48,6,38],['flower',96,88,56],['books',2,90,52],['glow',70,12,36],['bulb',30,40,44],['herb',60,80,48]];
  doodles.forEach(function(d, i){ if (!ICONS[d[0]]) return; bg.append(h('img',{class:'doodle', src:ICONS[d[0]], alt:'', style:'left:'+d[1]+'%;top:'+d[2]+'%;width:'+d[3]+'px;animation-duration:'+(7+i%5*1.6)+'s;animation-delay:'+(-i*1.3)+'s'})); });
  for (i=0;i<12;i++){ var sz = 10+Math.random()*26; bg.append(h('span',{class:'bubble', style:'left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;animation-duration:'+(14+Math.random()*14)+'s;animation-delay:'+(-Math.random()*25)+'s'})); }
  bg.append(h('div',{class:'hills', html:'<svg viewBox="0 0 1440 260" preserveAspectRatio="none" width="100%" height="100%"><path d="M0 150 C 180 70 360 70 540 130 S 900 210 1080 120 S 1340 60 1440 110 V260 H0Z" fill="var(--hill1)"/><path d="M0 190 C 220 120 420 150 620 185 S 1000 230 1200 170 S 1400 150 1440 165 V260 H0Z" fill="var(--hill2)"/><path d="M0 225 C 260 190 520 205 760 222 S 1220 240 1440 215 V260 H0Z" fill="var(--hill3)"/><g fill="var(--hill-dot)"><circle cx="160" cy="205" r="5"/><circle cx="420" cy="214" r="4"/><circle cx="700" cy="232" r="5"/><circle cx="980" cy="226" r="4"/><circle cx="1260" cy="202" r="5"/><circle cx="1360" cy="232" r="4"/></g><g fill="#ff8fab"><circle cx="300" cy="236" r="4"/><circle cx="860" cy="244" r="4"/><circle cx="1120" cy="238" r="4"/></g></svg>'}));
  document.body.insertBefore(bg, document.body.firstChild);
}
buildBackground();

/* ---- boot ---- */
function routeFromHash(){
  var c = (location.hash||'').replace('#','');
  var a = c && findByCode(c);
  return a ? {name:'hub', id:a.id} : null;
}
var start = routeFromHash() || (DATA.standalone && DATA.activities[0] ? {name:'hub', id:DATA.activities[0].id} : null);
if (start) view = start;
render();
window.addEventListener('hashchange', function(){ var r = routeFromHash(); if (r) go(r); });

(async function initCaps(){
  if (!window.claude || !window.claude.use) return;
  var names = ['user','artifact','sample','downloads'];
  var got = await Promise.all(names.map(function(n){ return window.claude.use(n).catch(function(){return null}); }));
  CAP.user = got[0]; CAP.artifact = got[1]; CAP.sample = got[2]; CAP.downloads = got[3];
  var edit = false;
  try { edit = CAP.user ? !!(await CAP.user.canEdit()) : false; } catch(e){}
  if (!edit) { CAP.sample = null; return; }
  IS_TEACHER = true;
  var ret = null; try { ret = JSON.parse(ssGet('fs:return')); } catch(e){}
  ssDel('fs:return');
  if (ret && ret.view) { go(ret.view); if (ret.msg) toast(ret.msg); }
  else if (!start) go({name:'studio'});
  else render();
})();
})();
